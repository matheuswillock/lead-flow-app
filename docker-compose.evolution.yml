# =============================================================================
# docker-compose.evolution.yml — Evolution API (API + Redis)
# =============================================================================
#
# Banco de dados: Supabase remoto (corretor-studio-evolution) via .env.evolution.
# Não há Postgres no Docker — alivia RAM/CPU na VPS (Hostinger).
#
# Uso:
#   cp .env.evolution.example .env.evolution
#   # Preencha [PASSWORD] e AUTHENTICATION_API_KEY em .env.evolution
#   bun run evo:up
#   bun run evo:logs
#   bun run evo:down
#
# Dev local: API em http://127.0.0.1:8080 (EVOLUTION_API_BIND padrão)
# VPS: EVOLUTION_API_BIND=127.0.0.1:8080 + Caddy (deploy/hostinger/Caddyfile)
#       ou use docker-compose.vps.yml (bun run vps:up)
#
# Chave: AUTHENTICATION_API_KEY em .env.evolution (= EVO_API_KEY no .env do app)
#
# Webhooks dev: EVO_WEBHOOK_PUBLIC_URL=http://host.docker.internal:3000 no .env do app
#
# Migração VPS (stack antiga com Postgres local):
#   docker compose -f docker-compose.evolution.yml --env-file .env.evolution down -v
#   docker volume rm evolution_postgres 2>/dev/null || true
#   bun run evo:up && bun run evo:logs
#
# =============================================================================

services:
  api:
    container_name: evolution_api
    # Upgrade only after contract fixtures pass; never deploy an implicit latest.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
    ports:
      - "${EVOLUTION_API_BIND:-127.0.0.1:8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net
      - n8n-net
    env_file:
      - .env.evolution
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  redis:
    container_name: evolution_redis
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net
    expose:
      - "6379"

volumes:
  evolution_instances:
  evolution_redis:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge
  # Permite webhook Bethânia em http://n8n:5678/... no dev local (stack n8n separada)
  n8n-net:
    name: n8n-net
    external: true
