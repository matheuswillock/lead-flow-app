name: Security (PR)

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security-reusable.yml
    permissions:
      contents: read
      actions: read
      security-events: write
    with:
      include_dev_dependencies: false
