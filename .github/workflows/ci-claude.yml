# .github/workflows/ci-claude.yml
name: CI (claude -> develop)

on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: ci-claude-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  deployments: write

jobs:
  ci:
    uses: ./.github/workflows/ci-branch-reusable.yml
    with:
      pr-base: develop
      concurrency-group: ci-claude
      automation-marker: ci-claude:automation
      pr-title-prefix: claude
      branch-strip-prefixes: claude/
      branch-prefixes: claude/
      run-spellcheck: true
      skip-build-on-github-rebase: true
    secrets: inherit
