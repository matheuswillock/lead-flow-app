name: Security Reusable

on:
  workflow_call:
    inputs:
      include_dev_dependencies:
        description: Include devDependencies in the Bun audit step
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  security:
    name: Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install production deps
        if: ${{ !inputs.include_dev_dependencies }}
        run: bun install --frozen-lockfile --production

      - name: Install all deps
        if: ${{ inputs.include_dev_dependencies }}
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        if: ${{ !inputs.include_dev_dependencies }}
        run: bun audit --prod --audit-level=high --ignore GHSA-737v-mqg7-c878

      - name: Audit all dependencies
        if: ${{ inputs.include_dev_dependencies }}
        run: bun audit --audit-level=high

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
