name: Apply Pending Migrations

on:
  workflow_dispatch:

concurrency:
  group: apply-migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  apply-migrations:
    name: Apply Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Link Supabase project
        run: bunx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply Migrations
        shell: bash
        run: |
          set -euo pipefail
          bun run db:migrate:push
          echo "### Migration Apply" >> "$GITHUB_STEP_SUMMARY"
          echo "Migrations applied successfully." >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
