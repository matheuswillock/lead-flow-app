# Smoke do runner self-hosted (VPS). Não consome minutos hosted.
#
# Topologia híbrida:
#   GitHub-hosted (ubuntu-latest) → typecheck, build (jobs pesados, RAM dedicada)
#   VPS self-hosted (lead-flow-ci) → lint, tests, spellcheck, deploy, sync
#
# Runners na VPS: lead-flow-vps-1, lead-flow-vps-2, srv1799450 (label lead-flow-ci)
name: CI (self-hosted smoke)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Self-hosted smoke
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          echo "pwd=$(pwd)"
          uname -a
          free -h | head -3
          command -v bun && bun --version
          command -v node && node --version
          command -v git && git --version
