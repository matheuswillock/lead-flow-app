# Smoke do runner self-hosted (VPS). Não consome minutos hosted.
#
# Topologia híbrida (CI otimizado):
#   GitHub-hosted (ubuntu-latest) → typecheck, build (jobs pesados, RAM dedicada por pipeline)
#   VPS self-hosted (lead-flow-ci)  → ci-light (lint + tests + spellcheck), quality-gate, deploy, sync
#
# Runners na VPS (manter 3 para paralelismo entre branches):
#   lead-flow-vps-1, lead-flow-vps-2, srv1799450 — label: lead-flow-ci
#
# Labels obsoletas (podem ser removidas no GitHub → Settings → Actions → Runners):
#   lead-flow-build, lead-flow-ci-1, lead-flow-ci-2
#
# Higiene VPS (lead-flow-vps-1 após OOM):
#   sudo mkdir -p /etc/systemd/system/actions.runner.matheuswillock-lead-flow-app.lead-flow-vps-1.service.d
#   printf '[Service]\nRestart=always\nRestartSec=30\n' | sudo tee .../override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart actions.runner...lead-flow-vps-1.service
name: CI (self-hosted smoke)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Self-hosted smoke
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          echo "user=$(whoami)"
          echo "pwd=$(pwd)"
          uname -a
          free -h | head -3
          command -v bun && bun --version
          command -v node && node --version
          command -v git && git --version
