# .github/workflows/ci-develop.yml
name: CI (develop -> version -> preview -> PR main)

on:
  push:
    branches: ["develop"]

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint & Typecheck
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      governance-sync: ${{ steps['quality-result'].outputs['governance-sync'] }}
      governance-check: ${{ steps['quality-result'].outputs['governance-check'] }}
      lint: ${{ steps['quality-result'].outputs.lint }}
      typecheck: ${{ steps['quality-result'].outputs.typecheck }}
      quality-passed: ${{ steps['quality-result'].outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Governance Sync
        id: governance-sync
        continue-on-error: true
        run: |
          bun run governance:sync
          git diff --exit-code

      - name: Governance Check
        id: governance-check
        continue-on-error: true
        run: bun run governance:check

      - name: Governance Allowlist Warnings
        continue-on-error: true
        run: bun run governance:warn-allowlist

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Spellcheck PT-BR
        id: spellcheck-pt-br
        continue-on-error: true
        run: bun run lint:pt-br

      - name: Resolve Quality Result
        id: quality-result
        if: always()
        run: |
          echo "governance-sync=${{ steps['governance-sync'].outcome }}" >> "$GITHUB_OUTPUT"
          echo "governance-check=${{ steps['governance-check'].outcome }}" >> "$GITHUB_OUTPUT"
          echo "lint=${{ steps.lint.outcome }}" >> "$GITHUB_OUTPUT"
          echo "typecheck=${{ steps.typecheck.outcome }}" >> "$GITHUB_OUTPUT"
          echo "spellcheck-pt-br=${{ steps['spellcheck-pt-br'].outcome }}" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps['governance-sync'].outcome }}" == "success" && "${{ steps['governance-check'].outcome }}" == "success" && "${{ steps.lint.outcome }}" == "success" && "${{ steps.typecheck.outcome }}" == "success" && "${{ steps['spellcheck-pt-br'].outcome }}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    name: Quality Gate
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - quality
    steps:
      - name: Enforce Quality Checks
        run: |
          if [[ "${{ needs.quality.outputs['quality-passed'] }}" != "true" ]]; then
            echo "::error::One or more quality checks failed."
            echo "governance:sync=${{ needs.quality.outputs['governance-sync'] }}"
            echo "governance:check=${{ needs.quality.outputs['governance-check'] }}"
            echo "lint=${{ needs.quality.outputs.lint }}"
            echo "typecheck=${{ needs.quality.outputs.typecheck }}"
            exit 1
          fi

  migration-check:
    name: Migration Check
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality-gate
    outputs:
      has_pending: ${{ steps.detect.outputs.has_pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Detect Migration Status
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_LIST="$(bun run db:migrate:status -- --db-url "$DIRECT_URL" 2>&1)"
          echo "$MIGRATION_LIST"

          RESULT=$(MIGRATION_LIST="$MIGRATION_LIST" node -e '
            const input = process.env.MIGRATION_LIST ?? "";
            let hasPending = false;

            for (const line of input.split(/\r?\n/)) {
              if (!/\d{14}/.test(line)) continue;
              const parts = line.split(/[│|]/).map(v => v.trim());
              const local = parts[0] ?? "";
              const remote = parts[1] ?? "";

              if (!local && remote) {
                process.stderr.write("Remote migration " + remote + " not tracked locally. Repair history before continuing.\n");
                process.exit(1);
              }
              if (local && remote && local !== remote) {
                process.stderr.write("Migration mismatch: local=" + local + " remote=" + remote + "\n");
                process.exit(1);
              }
              if (local && !remote) hasPending = true;
            }

            process.stdout.write(hasPending ? "true" : "false");
          ') || { echo "::error::Migration history is inconsistent. Repair remote history before continuing."; exit 1; }

          echo "has_pending=$RESULT" >> "$GITHUB_OUTPUT"

          if [ "$RESULT" = "true" ]; then
            echo "::notice::Pending migrations detected — dry-run and approval required before push."
          else
            echo "::notice::All migrations applied. No action required."
          fi
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  migration-dry-run:
    name: Migration Dry Run
    if: |
      !cancelled() &&
      (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) &&
      needs.migration-check.outputs.has_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - migration-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Link Supabase project
        run: bunx supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Dry Run Migration Push
        shell: bash
        run: |
          set -euo pipefail

          echo "### Migration Dry Run" >> "$GITHUB_STEP_SUMMARY"
          echo "The following migrations would be applied to the remote database:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          bun run db:migrate:push:dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Review the output above and approve the **Migration Apply** job to proceed." >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  build:
    name: Build
    if: |
      always() &&
      (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) &&
      needs.migration-check.result == 'success' &&
      needs.migration-check.outputs.has_pending == 'false' &&
      (needs.migration-dry-run.result == 'success' || needs.migration-dry-run.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - migration-check
      - migration-dry-run
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-
            ${{ runner.os }}-next-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder' }}
        run: bun run build

  version-bump:
    name: Auto Version Bump (develop)
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine version bump (main/release aware)
        id: bump
        run: |
          RELEASE_BRANCH="origin/release/develop-to-main"
          MAIN_BRANCH="origin/main"

          git fetch origin main --depth=1
          git fetch origin release/develop-to-main --depth=1 2>/dev/null || true

          # Read version strings via pipe — no execSync needed
          MAIN_VERSION=$(git show origin/main:package.json | node -e \
            "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")

          RELEASE_VERSION=""
          if git show "${RELEASE_BRANCH}:package.json" > /dev/null 2>&1; then
            RELEASE_VERSION=$(git show origin/release/develop-to-main:package.json | node -e \
              "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")
          fi

          # Returns 0 (true) if $1 is strictly greater than $2 using semver comparison.
          semver_gt() {
            local a_major a_minor a_patch b_major b_minor b_patch
            IFS='.' read -r a_major a_minor a_patch <<< "$1"
            IFS='.' read -r b_major b_minor b_patch <<< "$2"
            if [ "${a_major:-0}" -gt "${b_major:-0}" ]; then return 0; fi
            if [ "${a_major:-0}" -lt "${b_major:-0}" ]; then return 1; fi
            if [ "${a_minor:-0}" -gt "${b_minor:-0}" ]; then return 0; fi
            if [ "${a_minor:-0}" -lt "${b_minor:-0}" ]; then return 1; fi
            if [ "${a_patch:-0}" -gt "${b_patch:-0}" ]; then return 0; fi
            return 1
          }

          # Reuse only when the release branch carries a version strictly newer than main.
          # Equal or lower version means the PR was already merged or the branch is stale.
          if [ -n "$RELEASE_VERSION" ] && semver_gt "$RELEASE_VERSION" "$MAIN_VERSION"; then
            BUMP_TYPE="reused"
            NEW_VERSION="$RELEASE_VERSION"
          else
            CURRENT_VERSION="$MAIN_VERSION"

            RANGE="${MAIN_BRANCH}..HEAD"
            COMMITS=$(git log $RANGE --pretty=format:"%s")
            MERGES=$(git log $RANGE --merges --pretty=format:"%s")

            BUMP_TYPE="patch"
            if echo "$MERGES" | grep -qiE "from .*\/(feature|feat)\/"; then
              BUMP_TYPE="minor"
            elif echo "$MERGES" | grep -qiE "from .*\/(bugfix|fix)\/"; then
              BUMP_TYPE="patch"
            else
              if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
                BUMP_TYPE="minor"
              elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
                BUMP_TYPE="patch"
              fi
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case $BUMP_TYPE in
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Version bump summary
        run: |
          echo "### Version Bump (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- New Version: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bump Type: ${{ steps.bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    name: Deploy Vercel (Preview) from develop
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version-bump
    steps:
      - name: Checkout latest develop (includes bump)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Preview)
        id: vercel-preview
        run: |
          DEPLOY_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            2>&1 | tail -1)
          echo "preview-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Preview Summary
        run: |
          echo "### Preview Deploy (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps['vercel-preview'].outputs['preview-url'] }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: v${{ needs['version-bump'].outputs.new_version }}" >> $GITHUB_STEP_SUMMARY

  auto-pr-develop-to-main:
    name: Open PR develop -> main
    if: ${{ always() && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - quality-gate
      - build
      - deploy-preview
      - version-bump
    steps:
      - name: Checkout develop (latest)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reset release branch to develop and apply version bump
        if: ${{ needs['build'].result == 'success' }}
        run: |
          git checkout -B release/develop-to-main origin/develop
          VERSION="${{ needs['version-bump'].outputs.new_version }}"
          if [ -n "$VERSION" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git add package.json
            git diff --cached --quiet || git commit -m "chore: bump version to v$VERSION [skip ci]"
          fi
          git push origin release/develop-to-main --force-with-lease 2>/dev/null || \
            git push origin release/develop-to-main --force

      - name: Create or update PR
        id: release-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'release/develop-to-main';
            const base = 'main';
            const versionBumpResult = '${{ needs['version-bump'].result }}';
            const deployPreviewResult = '${{ needs['deploy-preview'].result }}';
            const buildResult = '${{ needs['build'].result }}';
            let newVersion = '${{ needs['version-bump'].outputs.new_version }}' || '';
            if (!newVersion) {
              try {
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                newVersion = pkg.version;
              } catch (_) {}
            }
            const bumpType = '${{ needs['version-bump'].outputs.bump_type }}';
            const canCreateReleasePr =
              buildResult === 'success' &&
              (versionBumpResult === 'success' || versionBumpResult === 'skipped') &&
              (deployPreviewResult === 'success' || deployPreviewResult === 'skipped');
            const checks = {
              governanceSync: '${{ needs.quality.outputs['governance-sync'] }}',
              governanceCheck: '${{ needs.quality.outputs['governance-check'] }}',
              lint: '${{ needs.quality.outputs.lint }}',
              typecheck: '${{ needs.quality.outputs.typecheck }}',
              build: '${{ needs.build.result }}',
              deployPreview: '${{ needs['deploy-preview'].result }}',
            };
            const isSuccess = (status) => status === 'success';
            const checklistLine = (status, label) => `- [${isSuccess(status) ? 'x' : ' '}] ${isSuccess(status) ? '✅' : '❌'} ${label}`;
            const replaceChecklistLine = (template, currentLabel, status, nextLabel) => {
              return template
                .split('\n')
                .map((line) => {
                  const normalizedLabel = line
                    .trim()
                    .replace(/^- \[[ x]\](?: ✅| ❌)? /, '');

                  return normalizedLabel === currentLabel ? checklistLine(status, nextLabel) : line;
                })
                .join('\n');
            };
            const applyChecklistStatuses = (template) => {
              let body = template;
              body = replaceChecklistLine(body, '`bun run governance:sync`', checks.governanceSync, '`bun run governance:sync`');
              body = replaceChecklistLine(body, '`bun run governance:check`', checks.governanceCheck, '`bun run governance:check`');
              body = replaceChecklistLine(body, '`bun run typecheck`', checks.typecheck, '`bun run typecheck`');
              body = replaceChecklistLine(body, '`bun run lint`', checks.lint, '`bun run lint`');
              body = replaceChecklistLine(body, 'Manteve adapters sincronizados (`bun run governance:sync`)?', checks.governanceSync, 'Manteve adapters sincronizados (`bun run governance:sync`)?');
              body = replaceChecklistLine(body, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?', checks.governanceSync, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?');
              return body;
            };
            const automationSection = (message) => [
              '<!-- ci-develop:automation:start -->',
              '## CI Automation',
              '',
              '**Source branch:** `develop`',
              `**Release branch:** \`${head}\``,
              `**Base:** \`${base}\``,
              `**Version:** \`${newVersion ? `v${newVersion}` : 'unavailable'}\``,
              `**Bump type:** \`${bumpType || 'unavailable'}\``,
              '',
              checklistLine(checks.build, 'Build OK'),
              checklistLine(checks.deployPreview, 'Preview deploy OK'),
              '',
              message,
              '<!-- ci-develop:automation:end -->'
            ].join('\n');
            const upsertAutomationSection = (body, message) => {
              const startMarker = '<!-- ci-develop:automation:start -->';
              const endMarker = '<!-- ci-develop:automation:end -->';
              const nextSection = automationSection(message);

              if (body.includes(startMarker) && body.includes(endMarker)) {
                return body.replace(
                  /<!-- ci-develop:automation:start -->[\s\S]*?<!-- ci-develop:automation:end -->/,
                  nextSection
                );
              }

              return [body.trimEnd(), '', nextSection].join('\n');
            };

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (prs.data.length > 0) {
              const existingPr = prs.data[0];
              const fallbackTemplate = fs.readFileSync('.github/pull_request_template.md', 'utf8');
              let body = applyChecklistStatuses(existingPr.body || fallbackTemplate);
              body = upsertAutomationSection(body, '*Atualizado automaticamente pelo GitHub Actions.*');
              const updatePayload = {
                owner,
                repo,
                pull_number: existingPr.number,
                body,
              };

              if (newVersion) {
                updatePayload.title = `release: v${newVersion}`;
              }

              await github.rest.pulls.update(updatePayload);

              core.setOutput('operation', 'updated');
              core.setOutput('pr-url', existingPr.html_url);
              core.setOutput('pr-number', String(existingPr.number));
              core.info(`PR atualizado: #${existingPr.number} ${existingPr.html_url}`);
              return;
            }

            if (!canCreateReleasePr) {
              core.info('Release branch was not updated because one or more required checks failed. No release PR created.');
              core.setOutput('operation', 'skipped');
              core.setOutput('pr-url', '');
              return;
            }

            let body = applyChecklistStatuses(fs.readFileSync('.github/pull_request_template.md', 'utf8'));
            body = upsertAutomationSection(body, '*Criado automaticamente pelo GitHub Actions.*');

            const res = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: `release: v${newVersion}`,
              body,
              maintainer_can_modify: true,
            });

            core.setOutput('operation', 'created');
            core.setOutput('pr-url', res.data.html_url);
            core.setOutput('pr-number', String(res.data.number));
            core.info(`PR criado: #${res.data.number} ${res.data.html_url}`);

      - name: Release PR summary
        run: |
          echo "### Release PR (develop -> main)" >> $GITHUB_STEP_SUMMARY
          echo "- Version: v${{ needs['version-bump'].outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Operation: ${{ steps['release-pr'].outputs.operation }}" >> $GITHUB_STEP_SUMMARY
          echo "- PR: ${{ steps['release-pr'].outputs['pr-url'] }}" >> $GITHUB_STEP_SUMMARY
