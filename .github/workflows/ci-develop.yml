# .github/workflows/ci-develop.yml
name: CI (develop -> version -> staging -> PR main)

on:
  push:
    branches: ["develop"]

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  deployments: write
  packages: write   # Necessário para push ao GitHub Container Registry (ghcr.io)

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/matheuswillock/lead-flow-app

jobs:
  quality:
    name: Lint & Typecheck
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Governance Check
        run: bun run governance:check

      - name: Governance Allowlist Warnings
        run: bun run governance:warn-allowlist

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  build-and-push:
    name: Build Docker Image (Staging) & Push to GHCR
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # Migrations de staging — usa STAGING_DIRECT_URL se disponível, senão cai para produção
      - name: Run Prisma Migrations (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL || secrets.DIRECT_URL }}
        run: bunx prisma migrate deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (staging)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-,format=short

      # Staging usa STAGING_NEXT_PUBLIC_APP_URL se disponível, senão cai para a URL de produção
      - name: Build and push Docker image (staging)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.STAGING_NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ENCRYPTION_KEY=${{ secrets.NEXT_PUBLIC_ENCRYPTION_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '' }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-staging
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache-staging,mode=max

  version-bump:
    name: Auto Version Bump (develop)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build-and-push
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine version bump (conventional commits)
        id: bump
        run: |
          LAST_BUMP_COMMIT=$(git log -1 --pretty=format:%H --grep="^chore: bump version to v" 2>/dev/null || true)
          if [ -n "$LAST_BUMP_COMMIT" ]; then
            RANGE="$LAST_BUMP_COMMIT..HEAD"
            COMMITS=$(git log $RANGE --pretty=format:"%s")
            MERGES=$(git log $RANGE --merges --pretty=format:"%s")
          else
            COMMITS=$(git log -50 --pretty=format:"%s")
            MERGES=$(git log -50 --merges --pretty=format:"%s")
          fi

          BUMP_TYPE="patch"
          if echo "$MERGES" | grep -qiE "from .*\/(feature|feat)\/"; then
            BUMP_TYPE="minor"
          elif echo "$MERGES" | grep -qiE "from .*\/(bugfix|fix)\/"; then
            BUMP_TYPE="patch"
          else
            if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
              BUMP_TYPE="minor"
            elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
              BUMP_TYPE="patch"
            fi
          fi

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case $BUMP_TYPE in
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
            pkg.version='${NEW_VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');
          "

      - name: Commit version bump (skip ci)
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

      - name: Version bump summary
        run: |
          echo "### Version Bump (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- New Version: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bump Type: ${{ steps.bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY

  deploy-staging:
    name: Deploy Hostinger (Staging)
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    needs: version-bump
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
      DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
      DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}
      COMPOSE_PATH: /opt/lead-flow-staging
    steps:
      - name: Checkout latest develop (includes version bump)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Grava .env de staging — ASAAS_ENV=sandbox hardcoded (reforçado pelo docker-compose.staging.yml)
      - name: Write .env on VPS (staging)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $COMPOSE_PATH && cat > $COMPOSE_PATH/.env << 'ENVEOF'
          NODE_ENV=production
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_LEAD_ATTACHMENTS_BUCKET=${{ secrets.SUPABASE_LEAD_ATTACHMENTS_BUCKET }}
          SUPABASE_PROFILE_ICONS_BUCKET=${{ secrets.SUPABASE_PROFILE_ICONS_BUCKET }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL || secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.STAGING_DIRECT_URL || secrets.DIRECT_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_TEST_MODE=true
          RESEND_OWNER_EMAIL=${{ secrets.RESEND_OWNER_EMAIL }}
          SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
          ASAAS_API_KEY=${{ secrets.ASAAS_API_KEY }}
          ASAAS_WALLET_ID=${{ secrets.ASAAS_WALLET_ID }}
          ASAAS_WEBHOOK_TOKEN=${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_ENV=sandbox
          ASAAS_URL=${{ secrets.ASAAS_URL_sandbox }}
          ASAAS_URL_sandbox=${{ secrets.ASAAS_URL_sandbox }}
          NEXT_PUBLIC_APP_URL=${{ secrets.STAGING_NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '' }}
          NEXT_API_BASE_URL=${{ secrets.NEXT_API_BASE_URL || '/api/v1' }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          NEXT_PUBLIC_ENCRYPTION_KEY=${{ secrets.NEXT_PUBLIC_ENCRYPTION_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY=${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET || '' }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN || '' }}
          META_VERIFY_TOKEN=${{ secrets.META_VERIFY_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
          ENVEOF"

      - name: Deploy via Docker Compose (staging)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "
              echo '${{ secrets.GITHUB_TOKEN }}' | \
                docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
              docker pull ${{ env.IMAGE_NAME }}:staging && \
              docker compose -f $COMPOSE_PATH/docker-compose.staging.yml up -d --remove-orphans && \
              docker logout ghcr.io && \
              docker image prune -f
            "

      - name: Staging Summary
        run: |
          echo "### Staging Deploy (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_NAME }}:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** v${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL:** ${{ secrets.STAGING_NEXT_PUBLIC_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_STEP_SUMMARY

  auto-pr-develop-to-main:
    name: Open PR develop -> main
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy-staging
    steps:
      - name: Checkout develop (latest)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Create PR (develop -> main) if needed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'develop';
            const base = 'main';

            let version = '0.0.0';
            try {
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              version = pkg.version || version;
            } catch {}

            const existing = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (existing.data.length > 0) {
              core.info(`PR já existe: #${existing.data[0].number} ${existing.data[0].html_url}`);
              return;
            }

            const cmp = await github.rest.repos.compareCommits({ owner, repo, base, head });
            if ((cmp.data.ahead_by || 0) === 0) {
              core.info('develop não está à frente do main. Sem PR.');
              return;
            }

            const commits = (cmp.data.commits || []).map(c => {
              const msg = c.commit.message.split('\n')[0];
              return `- ${msg} (\`${c.sha.slice(0,7)}\`)`;
            }).join('\n');

            const title = `release: v${version}`;
            const body = [
              '## Release (develop → main)',
              '',
              `**Version:** \`v${version}\``,
              `**Commits:** ${cmp.data.ahead_by}`,
              '',
              '## Changes',
              commits || '*(sem commits)*',
              '',
              '- [ ] Seguiu `agents.md`?',
              '- [ ] Criou excecao legada? Se sim, justificou e atualizou allowlist?',
              '- [ ] Rodou typecheck/lint?',
              '- [ ] Rodou governance check?',
              '- [ ] Staging deploy OK',
              '',
              '*PR criado automaticamente.*'
            ].join('\n');

            const pr = await github.rest.pulls.create({
              owner, repo,
              head, base,
              title, body,
              maintainer_can_modify: true,
            });

            core.info(`PR criado: #${pr.data.number} ${pr.data.html_url}`);
