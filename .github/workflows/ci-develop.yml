# .github/workflows/ci-develop.yml
name: CI (develop -> version -> preview -> PR main)

on:
  push:
    branches: ["develop"]

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint & Typecheck
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Governance Check
        run: bun run governance:check

      - name: Governance Allowlist Warnings
        run: bun run governance:warn-allowlist

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-
            ${{ runner.os }}-next-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder' }}
        run: bun run build

  version-bump:
    name: Auto Version Bump (develop)
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: build
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Determine version bump (main/release aware)
        id: bump
        run: |
          RELEASE_BRANCH="origin/release/develop-to-main"
          MAIN_BRANCH="origin/main"

          git fetch origin main --depth=1
          git fetch origin release/develop-to-main --depth=1 2>/dev/null || true

          if git show "${RELEASE_BRANCH}:package.json" > /dev/null 2>&1 && [ "$(git rev-list --count "${MAIN_BRANCH}..${RELEASE_BRANCH}")" -gt 0 ]; then
            CURRENT_VERSION=$(node -e "
              const { execSync } = require('child_process');
              const pkg = JSON.parse(execSync('git show origin/release/develop-to-main:package.json', {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              }));
              process.stdout.write(pkg.version);
            ")
            BUMP_TYPE="reused"
            NEW_VERSION="$CURRENT_VERSION"
          else
            CURRENT_VERSION=$(node -e "
              const { execSync } = require('child_process');
              const pkg = JSON.parse(execSync('git show origin/main:package.json', {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              }));
              process.stdout.write(pkg.version);
            ")

            RANGE="${MAIN_BRANCH}..HEAD"
            COMMITS=$(git log $RANGE --pretty=format:"%s")
            MERGES=$(git log $RANGE --merges --pretty=format:"%s")

            BUMP_TYPE="patch"
            if echo "$MERGES" | grep -qiE "from .*\/(feature|feat)\/"; then
              BUMP_TYPE="minor"
            elif echo "$MERGES" | grep -qiE "from .*\/(bugfix|fix)\/"; then
              BUMP_TYPE="patch"
            else
              if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
                BUMP_TYPE="minor"
              elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
                BUMP_TYPE="patch"
              fi
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

            case $BUMP_TYPE in
              minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
          fi

          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT

      - name: Version bump summary
        run: |
          echo "### Version Bump (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- New Version: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bump Type: ${{ steps.bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    name: Deploy Vercel (Preview) from develop
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: version-bump
    steps:
      - name: Checkout latest develop (includes bump)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Preview)
        id: vercel-preview
        run: |
          DEPLOY_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            2>&1 | tail -1)
          echo "preview-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Preview Summary
        run: |
          echo "### Preview Deploy (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.vercel-preview.outputs.preview-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version: v${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY

  auto-pr-develop-to-main:
    name: Open PR develop -> main
    if: ${{ github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - deploy-preview
      - version-bump
    steps:
      - name: Checkout develop (latest)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reset release branch to develop and apply version bump
        run: |
          git checkout -B release/develop-to-main origin/develop
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.version-bump.outputs.new_version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git add package.json
          git diff --cached --quiet || git commit -m "chore: bump version to v${{ needs.version-bump.outputs.new_version }} [skip ci]"
          git push origin release/develop-to-main --force-with-lease 2>/dev/null || \
            git push origin release/develop-to-main --force

      - name: Create or update PR
        id: release-pr
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY="## Release (develop → main)

          **Source branch:** \`develop\`
          **Version:** \`v${{ needs.version-bump.outputs.new_version }}\`
          **Bump type:** \`${{ needs.version-bump.outputs.bump_type }}\`

          - [ ] Seguiu \`agents.md\`?
          - [ ] Criou excecao legada? Se sim, justificou e atualizou allowlist?
          - [ ] Rodou typecheck/lint?
          - [ ] Rodou governance check?
          - [ ] Preview deploy OK

          *PR criado ou atualizado automaticamente pelo GitHub Actions.*"

          EXISTING_PR=$(gh pr list --base main --head release/develop-to-main --json number,url --jq '.[0]' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            PR_NUMBER=$(echo "$EXISTING_PR" | jq -r '.number')
            PR_URL=$(echo "$EXISTING_PR" | jq -r '.url')
            gh pr edit "$PR_NUMBER" \
              --title "release: v${{ needs.version-bump.outputs.new_version }}" \
              --body "$PR_BODY"
            echo "operation=updated" >> $GITHUB_OUTPUT
            echo "pr-url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            PR_URL=$(gh pr create \
              --base main \
              --head release/develop-to-main \
              --title "release: v${{ needs.version-bump.outputs.new_version }}" \
              --body "$PR_BODY")
            echo "operation=created" >> $GITHUB_OUTPUT
            echo "pr-url=$PR_URL" >> $GITHUB_OUTPUT
          fi

      - name: Release PR summary
        run: |
          echo "### Release PR (develop -> main)" >> $GITHUB_STEP_SUMMARY
          echo "- Version: v${{ needs.version-bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Operation: ${{ steps.release-pr.outputs.operation }}" >> $GITHUB_STEP_SUMMARY
          echo "- PR: ${{ steps.release-pr.outputs.pr-url }}" >> $GITHUB_STEP_SUMMARY
