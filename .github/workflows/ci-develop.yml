# .github/workflows/ci-develop.yml
name: CI (develop -> version -> release preview -> PR main)

on:
  push:
    branches: ["develop"]
    paths-ignore:
      - "package.json"
  # Escape hatch obrigatório: com `paths-ignore`, um push cujo diff líquido é
  # vazio ou só package.json (ex.: merge commit de sync main -> develop) não
  # dispara o workflow, e a release branch nunca é regenerada. Os jobs abaixo
  # rodam tanto em `push` quanto em `workflow_dispatch` para permitir a
  # regeneração manual sem commit artificial em develop.
  #
  # `workflow_dispatch` aceita qualquer `--ref`, então todos os jobs são gated
  # em `github.ref_name == 'develop'`. Sem isso, um dispatch a partir de uma
  # feature/bugfix/tag validaria aquele ref e o job de release resetaria
  # `release/develop-to-main` para o `github.sha` dele, furando a promoção.
  workflow_dispatch:

# cancel-in-progress: false — um run de develop precisa terminar atômico
# (version bump + push da release branch + PR); cancelar no meio deixava a
# release inconsistente. Pushes consecutivos enfileiram (GitHub mantém 1 pendente).
concurrency:
  group: ci-develop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=5120

jobs:
  ci-light:
    name: CI Light (VPS)
    if: ${{ github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 8
    outputs:
      governance-sync: ${{ steps.ci-light-checks.outputs['governance-sync'] }}
      governance-check: ${{ steps.ci-light-checks.outputs['governance-check'] }}
      api-masking-check: ${{ steps.ci-light-checks.outputs['api-masking-check'] }}
      lint: ${{ steps.ci-light-checks.outputs.lint }}
      passed: ${{ steps.ci-light-checks.outputs.passed }}
      tests-result: ${{ steps.ci-light-checks.outputs['tests-result'] }}
      spellcheck-result: ${{ steps.ci-light-checks.outputs['spellcheck-result'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Run light checks
        id: ci-light-checks
        uses: ./.github/actions/ci-vps-light-checks

  typecheck:
    name: Typecheck
    if: ${{ github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"
        run: bun run typecheck

  build:
    name: Build
    # Jobs pesados no runner hospedado do GitHub (RAM dedicada por pipeline, paralelo sem OOM na VPS).
    if: ${{ github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: bun run build

  e2e:
    name: E2E (Playwright)
    if: ${{ github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Playwright E2E
        uses: ./.github/actions/run-e2e-playwright
        with:
          include-slow: 'true'
          asaas-sandbox-api-key: ${{ secrets.ASAAS_SANDBOX_API_KEY }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    name: Quality Gate
    if: ${{ always() && github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 2
    needs:
      - ci-light
      - typecheck
      - build
      - e2e
    steps:
      - name: Enforce Quality Checks
        run: |
          failed=0
          if [[ "${{ needs.ci-light.outputs.passed }}" != "true" ]]; then
            echo "::error::Lint and/or governance checks failed."
            echo "governance:sync=${{ needs.ci-light.outputs['governance-sync'] }}"
            echo "governance:check=${{ needs.ci-light.outputs['governance-check'] }}"
            echo "governance:check-api-masking=${{ needs.ci-light.outputs['api-masking-check'] }}"
            echo "lint=${{ needs.ci-light.outputs.lint }}"
            failed=1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "::error::Typecheck failed."
            failed=1
          fi
          if [[ "${{ needs.ci-light.outputs['tests-result'] }}" != "success" ]]; then
            echo "::error::Tests failed."
            failed=1
          fi
          if [[ "${{ needs.ci-light.outputs['spellcheck-result'] }}" != "success" ]]; then
            echo "::error::Spellcheck PT-BR failed."
            failed=1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "::error::Build failed."
            failed=1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "::error::E2E tests failed."
            failed=1
          fi
          exit "$failed"

  migration-check:
    name: Migration Check
    if: |
      always() &&
      needs.quality-gate.result == 'success' &&
      github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    needs:
      - quality-gate
    outputs:
      has_pending: ${{ steps.detect.outputs.has_pending }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Detect Migration Status
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          MIGRATION_LIST="$(supabase migration list --db-url "$DIRECT_URL" 2>&1)"
          echo "$MIGRATION_LIST"

          RESULT=$(MIGRATION_LIST="$MIGRATION_LIST" node -e '
            const input = process.env.MIGRATION_LIST ?? "";
            let hasPending = false;

            const stripCell = (value) => value.trim().replace(/^`|`$/g, "");

            for (const line of input.split(/\r?\n/)) {
              if (!/\d{14}/.test(line)) continue;
              const parts = line.split(/[│|]/).map(stripCell);
              const local = parts[0] ?? "";
              const remote = parts[1] ?? "";

              if (!local && remote) {
                process.stderr.write("Remote migration " + remote + " not tracked locally. Repair history before continuing.\n");
                process.exit(1);
              }
              if (local && remote && local !== remote) {
                process.stderr.write("Migration mismatch: local=" + local + " remote=" + remote + "\n");
                process.exit(1);
              }
              if (local && !remote) hasPending = true;
            }

            process.stdout.write(hasPending ? "true" : "false");
          ') || { echo "::error::Migration history is inconsistent. Repair remote history before continuing."; exit 1; }

          echo "has_pending=$RESULT" >> "$GITHUB_OUTPUT"

          if [ "$RESULT" = "true" ]; then
            echo "::notice::Pending migrations detected — dry-run and approval required before push."
          else
            echo "::notice::All migrations applied. No action required."
          fi
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  migration-dry-run:
    name: Migration Dry Run
    if: |
      !cancelled() &&
      github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) &&
      needs.migration-check.outputs.has_pending == 'true'
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    needs:
      - migration-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Dry Run Migration Push
        shell: bash
        run: |
          set -euo pipefail

          echo "### Migration Dry Run" >> "$GITHUB_STEP_SUMMARY"
          echo "The following migrations would be applied to the remote database:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --linked --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Review the output above and approve the **Migration Apply** job to proceed." >> "$GITHUB_STEP_SUMMARY"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  version-bump:
    name: Auto Version Bump (develop)
    if: |
      github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) &&
      needs.quality-gate.result == 'success'
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 8
    needs:
      - quality-gate
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      bumped: ${{ steps.bump.outputs.bumped }}
      bump_type: ${{ steps.bump.outputs.bump_type }}
      base_version: ${{ steps.bump.outputs.base_version }}
      has_code_changes: ${{ steps.bump.outputs.has_code_changes }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Determine version bump (main/release aware)
        id: bump
        run: |
          RELEASE_BRANCH="origin/release/develop-to-main"
          MAIN_BRANCH="origin/main"

          # Full fetch required: shallow refs break merge-base resolution used by
          # `git diff origin/main...HEAD` and `git log A..B` below, which is what
          # made this job fail intermittently as develop/main history grew apart.
          git fetch origin main
          git fetch origin release/develop-to-main 2>/dev/null || true

          DEVELOP_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")

          # Sem diff de codigo em develop desde main → nao ha release a publicar.
          if git diff --quiet origin/main...HEAD -- . ':!package.json'; then
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "has_code_changes=false" >> $GITHUB_OUTPUT
            echo "new_version=$DEVELOP_VERSION" >> $GITHUB_OUTPUT
            echo "bump_type=unchanged" >> $GITHUB_OUTPUT
            echo "base_version=$DEVELOP_VERSION" >> $GITHUB_OUTPUT
            echo "Skipped version bump — develop has no code changes since main"
            exit 0
          fi

          echo "has_code_changes=true" >> $GITHUB_OUTPUT

          MAIN_VERSION=$(git show origin/main:package.json | node -e \
            "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")

          RELEASE_VERSION=""
          if git show "${RELEASE_BRANCH}:package.json" > /dev/null 2>&1; then
            RELEASE_VERSION=$(git show origin/release/develop-to-main:package.json | node -e \
              "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")
          fi

          semver_gt() {
            local a_major a_minor a_patch b_major b_minor b_patch
            IFS='.' read -r a_major a_minor a_patch <<< "$1"
            IFS='.' read -r b_major b_minor b_patch <<< "$2"
            if [ "${a_major:-0}" -gt "${b_major:-0}" ]; then return 0; fi
            if [ "${a_major:-0}" -lt "${b_major:-0}" ]; then return 1; fi
            if [ "${a_minor:-0}" -gt "${b_minor:-0}" ]; then return 0; fi
            if [ "${a_minor:-0}" -lt "${b_minor:-0}" ]; then return 1; fi
            if [ "${a_patch:-0}" -gt "${b_patch:-0}" ]; then return 0; fi
            return 1
          }

          # When a release PR is open, bump from the release version (not main).
          if [ -n "$RELEASE_VERSION" ] && semver_gt "$RELEASE_VERSION" "$MAIN_VERSION"; then
            CURRENT_VERSION="$RELEASE_VERSION"
            BUMP_SOURCE="release"
            RELEASE_SHA=$(git rev-parse "$RELEASE_BRANCH")
            COMMITS_SINCE_RELEASE=$(git rev-list --count "${RELEASE_SHA}..HEAD" || echo "0")
            if [ "$COMMITS_SINCE_RELEASE" -eq 0 ]; then
              NEW_VERSION="$RELEASE_VERSION"
              BUMP_TYPE="unchanged"
              echo "bumped=false" >> $GITHUB_OUTPUT
              echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
              echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
              echo "base_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
              echo "Reusing v$NEW_VERSION — no new commits on develop since release branch"
              exit 0
            fi
          else
            CURRENT_VERSION="$MAIN_VERSION"
            BUMP_SOURCE="main"
          fi

          if [ "$BUMP_SOURCE" = "release" ]; then
            RANGE="${RELEASE_SHA}..HEAD"
          else
            RANGE="${MAIN_BRANCH}..HEAD"
          fi
          COMMITS=$(git log $RANGE --pretty=format:"%s")
          MERGES=$(git log $RANGE --merges --pretty=format:"%s")

          BUMP_TYPE="patch"
          if echo "$MERGES" | grep -qiE "from .*\/(feature|feat)\/"; then
            BUMP_TYPE="minor"
          elif echo "$MERGES" | grep -qiE "from .*\/(bugfix|fix)\/"; then
            BUMP_TYPE="patch"
          else
            if echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
              BUMP_TYPE="minor"
            elif echo "$COMMITS" | grep -qiE "^fix(\(.+\))?:"; then
              BUMP_TYPE="patch"
            fi
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          case $BUMP_TYPE in
            minor) NEW_VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "bumped=true" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "base_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Computed v$NEW_VERSION ($BUMP_TYPE) from $BUMP_SOURCE base v$CURRENT_VERSION (main=v$MAIN_VERSION, release=${RELEASE_VERSION:-none})"

      - name: Version bump summary
        run: |
          echo "### Version Bump (develop)" >> $GITHUB_STEP_SUMMARY
          echo "- Base Version: v${{ steps.bump.outputs.base_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- New Version: v${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bump Type: ${{ steps.bump.outputs.bump_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Applied on release branch after build passes (only when code changed)" >> $GITHUB_STEP_SUMMARY
          echo "- Has code changes: ${{ steps.bump.outputs.has_code_changes }}" >> $GITHUB_STEP_SUMMARY

  auto-pr-develop-to-main:
    name: Open PR develop -> main
    if: ${{ always() && github.ref_name == 'develop' && (github.event.head_commit == null || !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 15
    needs:
      - ci-light
      - typecheck
      - quality-gate
      - migration-check
      - migration-dry-run
      - build
      - version-bump
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reset release branch to develop and apply version bump
        id: push-release
        if: ${{ needs['build'].result == 'success' && needs['version-bump'].outputs.bumped == 'true' && needs['migration-check'].outputs.has_pending == 'false' }}
        run: |
          git checkout -B release/develop-to-main ${{ github.sha }}
          VERSION="${{ needs['version-bump'].outputs.new_version }}"
          if [ -n "$VERSION" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git add package.json
            git diff --cached --quiet || git commit -m "chore: bump version to v$VERSION"
          fi
          # No blind --force fallback: if the lease fails, someone pushed to this
          # branch since we last read it (e.g. a manual hotfix on the release PR).
          # Overwriting it silently is how commits used to disappear from release.
          # Fail loudly instead so a human reconciles it.
          # --no-verify: este job não instala deps; quality gate já validou o commit.
          # (pre-push também pula em CI=true; belt-and-suspenders no self-hosted.)
          git push origin release/develop-to-main --force-with-lease --no-verify
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Preview de TODA push para `develop` era o maior gerador de Build CPU
      # Minutes na Vercel. Diferente do `ci-main`, aqui NÃO dá para reaproveitar
      # o artefato do job `build`: este deploy sai do `release/develop-to-main`
      # já com o version bump aplicado — outro conteúdo, outra versão no
      # package.json. Reaproveitar publicaria a versão errada.
      #
      # Relocar o build para o runner self-hosted também não serve: `next build`
      # pica em 2,5–4 GB e a VPS é compartilhada com Evolution/N8N (ver nota
      # `VPS/GitHub Actions Self-Hosted`, guardrail de OOM).
      #
      # Então o corte aqui é de FREQUÊNCIA, não de lugar: opt-in via variável de
      # repositório. Ligar com `gh variable set DEPLOY_DEVELOP_PREVIEW --body true`
      # quando a validação do release exigir URL de preview.
      - name: Deploy Vercel (Preview) from release branch
        id: vercel-preview
        if: ${{ vars.DEPLOY_DEVELOP_PREVIEW == 'true' && steps['push-release'].outcome == 'success' && steps['push-release'].outputs.pushed == 'true' }}
        run: |
          # Working tree is already release/develop-to-main (post version bump).
          DEPLOY_URL=$(npx --yes vercel@56.3.2 deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            2>&1 | tail -1)
          echo "preview-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### Preview Deploy (release/develop-to-main)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: v${{ needs['version-bump'].outputs.new_version }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Create or update PR
        id: release-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'release/develop-to-main';
            const base = 'main';
            const versionBumpResult = '${{ needs['version-bump'].result }}';
            const releasePushResult = '${{ steps['push-release'].outcome }}';
            const deployPreviewResult = '${{ steps['vercel-preview'].outcome }}';
            const previewUrl = '${{ steps['vercel-preview'].outputs.preview-url }}';
            const buildResult = '${{ needs['build'].result }}';
            const migrationCheckResult = '${{ needs['migration-check'].result }}';
            const migrationDryRunResult = '${{ needs['migration-dry-run'].result }}';
            const hasPendingMigrations = '${{ needs['migration-check'].outputs.has_pending }}' === 'true';
            const qualityGateResult = '${{ needs['quality-gate'].result }}';
            let newVersion = '${{ needs['version-bump'].outputs.new_version }}' || '';
            if (!newVersion) {
              try {
                const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
                newVersion = pkg.version;
              } catch (_) {}
            }
            const bumpType = '${{ needs['version-bump'].outputs.bump_type }}';
            const baseVersion = '${{ needs['version-bump'].outputs.base_version }}' || '';
            const versionBumped = '${{ needs['version-bump'].outputs.bumped }}' === 'true';
            const hasCodeChanges = '${{ needs['version-bump'].outputs.has_code_changes }}' === 'true';
            const canCreateReleasePr =
              buildResult === 'success' &&
              versionBumpResult === 'success' &&
              versionBumped &&
              hasCodeChanges &&
              !hasPendingMigrations &&
              migrationCheckResult === 'success' &&
              (migrationDryRunResult === 'success' || migrationDryRunResult === 'skipped') &&
              releasePushResult === 'success' &&
              // 'skipped' aqui = preview desligado de proposito (vars.DEPLOY_DEVELOP_PREVIEW).
              // Nao mascara falha de push da release: releasePushResult === 'success'
              // ja e exigido na linha acima, entao o unico caminho para 'skipped'
              // com push OK e o opt-out deliberado.
              (deployPreviewResult === 'success' || deployPreviewResult === 'skipped');
            const resolveSkipReason = () => {
              if (qualityGateResult !== 'success') {
                return 'Quality gate falhou. Corrija governance, lint, typecheck, spellcheck ou build em develop.';
              }
              if (migrationCheckResult !== 'success') {
                return 'Migration check falhou ou foi ignorado. Revise o job "Migration Check".';
              }
              if (hasPendingMigrations) {
                return 'Migrations pendentes no banco remoto. Revise o dry-run, execute o workflow "Apply Pending Migrations" e faça um novo push em develop.';
              }
              if (migrationDryRunResult === 'failure') {
                return 'Migration dry-run falhou. Corrija as migrations antes de liberar o release.';
              }
              if (versionBumpResult !== 'success') {
                return 'Version bump nao executou. Revise quality gate e migration check.';
              }
              if (!hasCodeChanges || !versionBumped || bumpType === 'unchanged') {
                return 'Nenhuma alteracao de codigo em develop desde main. Release ignorada para evitar ciclo de versionamento.';
              }
              if (buildResult === 'failure') {
                return 'Build falhou. Corrija os erros de compilacao antes de liberar o release.';
              }
              if (buildResult === 'skipped') {
                return 'Build nao executou. Verifique os jobs anteriores do workflow.';
              }
              if (releasePushResult === 'failure') {
                return 'Push da branch release/develop-to-main falhou. Reconcilie a release branch e tente de novo.';
              }
              if (releasePushResult === 'skipped') {
                return 'Push da branch release nao executou. Verifique build, version bump e migrations.';
              }
              if (deployPreviewResult === 'failure') {
                return 'Deploy de preview da release falhou. Corrija o deploy na Vercel antes de liberar o release.';
              }
              // 'skipped' nao bloqueia mais o release (preview e opt-in), entao
              // so cai aqui se algum outro check acima ja tiver falhado.
              return 'Um ou mais checks obrigatorios nao passaram.';
            };
            const checks = {
              governanceSync: '${{ needs.ci-light.outputs['governance-sync'] }}',
              governanceCheck: '${{ needs.ci-light.outputs['governance-check'] }}',
              apiMaskingCheck: '${{ needs.ci-light.outputs['api-masking-check'] }}',
              lint: '${{ needs.ci-light.outputs.lint }}',
              typecheck: '${{ needs.typecheck.result }}',
              migrationCheck: migrationCheckResult,
              migrationsPending: hasPendingMigrations ? 'failure' : 'success',
              migrationDryRun: migrationDryRunResult,
              build: '${{ needs['build'].result }}',
              deployPreview: deployPreviewResult,
            };
            const isSuccess = (status) => status === 'success';
            const checklistLine = (status, label) => `- [${isSuccess(status) ? 'x' : ' '}] ${isSuccess(status) ? '✅' : '❌'} ${label}`;
            const replaceChecklistLine = (template, currentLabel, status, nextLabel) => {
              return template
                .split('\n')
                .map((line) => {
                  const normalizedLabel = line
                    .trim()
                    .replace(/^- \[[ x]\](?: ✅| ❌)? /, '');

                  return normalizedLabel === currentLabel ? checklistLine(status, nextLabel) : line;
                })
                .join('\n');
            };
            const applyChecklistStatuses = (template) => {
              let body = template;
              body = replaceChecklistLine(body, '`bun run governance:sync`', checks.governanceSync, '`bun run governance:sync`');
              body = replaceChecklistLine(body, '`bun run governance:check`', checks.governanceCheck, '`bun run governance:check`');
              body = replaceChecklistLine(body, '`bun run governance:check-api-masking`', checks.apiMaskingCheck, '`bun run governance:check-api-masking`');
              body = replaceChecklistLine(body, '`bun run typecheck`', checks.typecheck, '`bun run typecheck`');
              body = replaceChecklistLine(body, '`bun run lint`', checks.lint, '`bun run lint`');
              body = replaceChecklistLine(body, 'Manteve adapters sincronizados (`bun run governance:sync`)?', checks.governanceSync, 'Manteve adapters sincronizados (`bun run governance:sync`)?');
              body = replaceChecklistLine(body, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?', checks.governanceSync, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?');
              return body;
            };
            const automationSection = (message) => [
              '<!-- ci-develop:automation:start -->',
              '## CI Automation',
              '',
              '**Source branch:** `develop`',
              `**Release branch:** \`${head}\``,
              `**Base:** \`${base}\``,
              `**Version:** \`${newVersion ? `v${newVersion}` : 'unavailable'}\``,
              `**Base version:** \`${baseVersion || 'unavailable'}\``,
              `**Bump type:** \`${bumpType || 'unavailable'}\``,
              '',
              checklistLine(checks.migrationCheck, 'Migration check OK'),
              checklistLine(checks.migrationsPending, 'Sem migrations pendentes'),
              checklistLine(checks.build, 'Build OK'),
              checklistLine(checks.deployPreview, 'Preview deploy OK (release)'),
              previewUrl ? `**Preview URL:** ${previewUrl}` : '**Preview URL:** unavailable',
              '',
              message,
              '<!-- ci-develop:automation:end -->'
            ].join('\n');
            const upsertAutomationSection = (body, message) => {
              const startMarker = '<!-- ci-develop:automation:start -->';
              const endMarker = '<!-- ci-develop:automation:end -->';
              const nextSection = automationSection(message);

              if (body.includes(startMarker) && body.includes(endMarker)) {
                return body.replace(
                  /<!-- ci-develop:automation:start -->[\s\S]*?<!-- ci-develop:automation:end -->/,
                  nextSection
                );
              }

              return [body.trimEnd(), '', nextSection].join('\n');
            };

            // Soft-skip: no release expected (empty develop). Hard-skip: release was
            // expected but blocked (deploy/migrations/build). Soft stays green; hard fails.
            const isSoftSkip =
              !hasCodeChanges ||
              !versionBumped ||
              bumpType === 'unchanged';
            const rejectUnlessReleaseReady = (prUrl = '') => {
              if (canCreateReleasePr) {
                return false;
              }
              const skipReason = resolveSkipReason();
              core.warning(skipReason);
              core.info(`Release branch was not updated. Reason: ${skipReason}`);
              core.setOutput('operation', 'skipped');
              core.setOutput('skip-reason', skipReason);
              core.setOutput('pr-url', prUrl);
              if (!isSoftSkip) {
                core.setFailed(skipReason);
              }
              return true;
            };

            const prs = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (prs.data.length > 0) {
              const existingPr = prs.data[0];
              if (!hasCodeChanges || !versionBumped) {
                core.info('Open release PR kept unchanged — no new code on develop since main.');
                core.setOutput('operation', 'unchanged');
                core.setOutput('skip-reason', 'Nenhuma alteracao de codigo em develop desde main.');
                core.setOutput('pr-url', existingPr.html_url);
                core.setOutput('pr-number', String(existingPr.number));
                return;
              }
              // Hard gates must pass before retitling/updating an existing release PR
              // (e.g. pending migrations skip release push/preview; do not advertise a version
              // that was never pushed to the release branch).
              if (rejectUnlessReleaseReady(existingPr.html_url)) {
                core.setOutput('pr-number', String(existingPr.number));
                return;
              }
              const fallbackTemplate = fs.readFileSync('.github/pull_request_template.md', 'utf8');
              let body = applyChecklistStatuses(existingPr.body || fallbackTemplate);
              body = upsertAutomationSection(body, '*Atualizado automaticamente pelo GitHub Actions.*');
              const updatePayload = {
                owner,
                repo,
                pull_number: existingPr.number,
                body,
              };

              if (newVersion && buildResult === 'success') {
                updatePayload.title = `release: v${newVersion}`;
              }

              await github.rest.pulls.update(updatePayload);

              core.setOutput('operation', 'updated');
              core.setOutput('pr-url', existingPr.html_url);
              core.setOutput('pr-number', String(existingPr.number));
              core.info(`PR atualizado: #${existingPr.number} ${existingPr.html_url}`);
              return;
            }

            if (rejectUnlessReleaseReady('')) {
              return;
            }

            let body = applyChecklistStatuses(fs.readFileSync('.github/pull_request_template.md', 'utf8'));
            body = upsertAutomationSection(body, '*Criado automaticamente pelo GitHub Actions.*');

            const res = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title: `release: v${newVersion}`,
              body,
              maintainer_can_modify: true,
            });

            core.setOutput('operation', 'created');
            core.setOutput('pr-url', res.data.html_url);
            core.setOutput('pr-number', String(res.data.number));
            core.info(`PR criado: #${res.data.number} ${res.data.html_url}`);

      - name: Release PR summary
        if: always()
        run: |
          echo "### Release PR (develop -> main)" >> $GITHUB_STEP_SUMMARY
          echo "- Version: v${{ needs['version-bump'].outputs.new_version || 'unavailable' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Base version: v${{ needs['version-bump'].outputs.base_version || 'unavailable' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version bump job: ${{ needs['version-bump'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Has code changes: ${{ needs['version-bump'].outputs.has_code_changes || 'unknown' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Version bumped: ${{ needs['version-bump'].outputs.bumped || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Operation: ${{ steps['release-pr'].outputs.operation || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Migration check: ${{ needs['migration-check'].result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Pending migrations: ${{ needs['migration-check'].outputs.has_pending }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps['release-pr'].outputs['skip-reason'] }}" ]; then
            echo "- Blocked: ${{ steps['release-pr'].outputs['skip-reason'] }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- PR: ${{ steps['release-pr'].outputs['pr-url'] || 'not created' }}" >> $GITHUB_STEP_SUMMARY
