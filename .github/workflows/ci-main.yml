# .github/workflows/ci-main.yml
name: CI (main -> production)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint-and-governance:
    name: Lint & Governance
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Governance Check
        run: bun run governance:check

      - name: Governance Sync Check
        run: |
          bun run governance:sync
          git diff --exit-code

      - name: Governance Allowlist Warnings
        run: bun run governance:warn-allowlist

      - name: Lint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bun run typecheck

  tests:
    name: Tests
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Proxy Tests
        id: proxy-tests
        continue-on-error: true
        run: bun run test:proxy

      - name: Unit Tests
        id: unit-tests
        continue-on-error: true
        run: bun run test

      - name: Resolve Tests
        if: always()
        run: |
          if [[ "${{ steps['proxy-tests'].outcome }}" != "success" || "${{ steps['unit-tests'].outcome }}" != "success" ]]; then
            echo "::error::proxy-tests=${{ steps['proxy-tests'].outcome }} unit-tests=${{ steps['unit-tests'].outcome }}"
            exit 1
          fi

  migration-status:
    name: Migration Status
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    needs:
      - lint-and-governance
      - typecheck
      - tests
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Check Migration Status
        shell: bash
        run: |
          set -euo pipefail

          migration_list="$(supabase migration list --db-url "$DIRECT_URL")"
          echo "$migration_list"

          if MIGRATION_LIST="$migration_list" node -e '
            const input = process.env.MIGRATION_LIST ?? "";
            let bad = false;

            for (const line of input.split(/\r?\n/)) {
              if (!/\d{14}/.test(line)) {
                continue;
              }

              const [local = "", remote = ""] = line.split(/[│|]/).map((value) => value.trim());

              if (!local || !remote || local !== remote) {
                bad = true;
                break;
              }
            }

            process.exit(bad ? 1 : 0);
          '; then
            exit 0
          fi

          echo "Migration history is out of sync. Apply the missing migrations or repair the remote history before merging."
          exit 1
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  build:
    name: Build
    # Jobs pesados no runner hospedado do GitHub (RAM dedicada por pipeline, paralelo sem OOM na VPS).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'placeholder-resend-key' }}
          DATABASE_URL: ${{ github.event_name == 'push' && secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@placeholder:5432/placeholder' }}
          DIRECT_URL: ${{ github.event_name == 'push' && secrets.DIRECT_URL || 'postgresql://placeholder:placeholder@placeholder:5432/placeholder' }}
        run: bun run build

  deploy-production:
    name: Deploy Vercel (Production)
    if: |
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      needs['migration-status'].result == 'success'
    needs:
      - build
      - migration-status
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Deploy to Vercel (Production)
        id: vercel-prod
        run: |
          DEPLOY_URL=$(npx --yes vercel@56.3.2 deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            2>&1 | tail -1)
          echo "deploy-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Production Summary
        run: |
          echo "### Production Deploy (main)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.vercel-prod.outputs.deploy-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
