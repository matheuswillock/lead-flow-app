# .github/workflows/ci-main.yml
name: CI (main -> production)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-main-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=5120

jobs:
  ci-light:
    name: CI Light (VPS)
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 8
    outputs:
      governance-sync: ${{ steps.ci-light-checks.outputs['governance-sync'] }}
      governance-check: ${{ steps.ci-light-checks.outputs['governance-check'] }}
      api-masking-check: ${{ steps.ci-light-checks.outputs['api-masking-check'] }}
      lint: ${{ steps.ci-light-checks.outputs.lint }}
      passed: ${{ steps.ci-light-checks.outputs.passed }}
      tests-result: ${{ steps.ci-light-checks.outputs['tests-result'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Run light checks
        id: ci-light-checks
        uses: ./.github/actions/ci-vps-light-checks
        with:
          run-spellcheck: false
          strict-governance: true

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"
        run: bun run typecheck

  migration-status:
    name: Migration Status
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    needs:
      - ci-light
      - typecheck
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Check Migration Status
        shell: bash
        run: |
          set -euo pipefail

          migration_list="$(supabase migration list --db-url "$DIRECT_URL")"
          echo "$migration_list"

          if MIGRATION_LIST="$migration_list" node -e '
            const input = process.env.MIGRATION_LIST ?? "";
            let bad = false;

            for (const line of input.split(/\r?\n/)) {
              if (!/\d{14}/.test(line)) {
                continue;
              }

              const [local = "", remote = ""] = line.split(/[│|]/).map((value) => value.trim());

              if (!local || !remote || local !== remote) {
                bad = true;
                break;
              }
            }

            process.exit(bad ? 1 : 0);
          '; then
            exit 0
          fi

          echo "Migration history is out of sync. Apply the missing migrations or repair the remote history before merging."
          exit 1
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  build:
    name: Build
    # Jobs pesados no runner hospedado do GitHub (RAM dedicada por pipeline, paralelo sem OOM na VPS).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Generate Prisma Client
        run: bun run prisma:generate

      # PR: só quality gate — não gera artefato de deploy.
      - name: Build (quality gate)
        if: ${{ github.event_name != 'push' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'placeholder-resend-key' }}
          DATABASE_URL: 'postgresql://placeholder:placeholder@placeholder:5432/placeholder'
          DIRECT_URL: 'postgresql://placeholder:placeholder@placeholder:5432/placeholder'
        run: bun run build

      # Push: o MESMO build vira o artefato de deploy.
      #
      # Antes: este job buildava aqui e o `deploy-production` chamava
      # `vercel deploy` sem `--prebuilt` — a Vercel rebuildava do zero em
      # máquina dela, cobrada como Build CPU Minutes (72% da fatura de uso em
      # ago/2026, ~$145/ciclo). Pagávamos para buildar duas vezes.
      #
      # `vercel build` executa o mesmo build command do projeto, então o quality
      # gate é preservado: se o build quebrar, o job falha aqui como antes.
      - name: Vercel build (produção)
        if: ${{ github.event_name == 'push' }}
        run: |
          npx --yes vercel@56.3.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@56.3.2 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # `.vercel/output` contém o build pronto. `.vercel/project.json` NÃO sobe:
      # o job de deploy reconstrói a identidade do projeto pelas env vars.
      - name: Upload build artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output
          retention-days: 1
          include-hidden-files: true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Playwright E2E
        uses: ./.github/actions/run-e2e-playwright
        with:
          include-slow: 'true'
          asaas-sandbox-api-key: ${{ secrets.ASAAS_SANDBOX_API_KEY }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  deploy-production:
    name: Deploy Vercel (Production)
    if: |
      github.event_name == 'push' &&
      needs.build.result == 'success' &&
      needs['migration-status'].result == 'success' &&
      needs.e2e.result == 'success'
    needs:
      - build
      - migration-status
      - e2e
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output

      # `.vercel/output` referencia `node_modules/.prisma/client/client.js` por
      # caminho relativo à raiz do projeto (output tracing do Next). O build roda
      # em `ubuntu-latest` e o deploy aqui, noutra máquina, então esse alvo não
      # existe e o `vercel deploy --prebuilt` aborta com
      # `File does not exist: "node_modules/.prisma/client/client.js"`.
      # Reinstalar as deps + gerar o client restaura o alvo do link.
      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Generate Prisma Client
        run: bun run prisma:generate

      # `--prebuilt` sobe o `.vercel/output` já pronto em vez de mandar o
      # código-fonte para a Vercel rebuildar. Build CPU Minutes -> ~0.
      #
      # Sem `vercel pull` aqui de propósito: `VERCEL_ORG_ID` + `VERCEL_PROJECT_ID`
      # já identificam o projeto, e `pull` traria as env vars de produção para o
      # disco do runner self-hosted — o guardrail da nota
      # `VPS/GitHub Actions Self-Hosted` pede o contrário.
      #
      # NÃO reintroduzir `2>&1 | tail -1`: sem `pipefail` o shell enxergava o
      # exit code do `tail`, não o do CLI. Dois deploys de produção falharam em
      # silêncio (21/08 capturou a borda `╰──╯` do CLI, 22/08 capturou
      # `File does not exist: ...`) e produção ficou 3 dias atrás de `main` com
      # o job verde. `--meta` carimba o SHA para o passo de verificação abaixo.
      - name: Deploy to Vercel (Production)
        id: vercel-prod
        run: |
          set -euo pipefail

          DEPLOY_LOG="$(mktemp)"
          if ! npx --yes vercel@56.3.2 deploy --prebuilt --prod \
            --token="$VERCEL_TOKEN" \
            --yes \
            --meta githubCommitSha="$GITHUB_SHA" \
            >"$DEPLOY_LOG" 2>&1; then
            echo "::error::vercel deploy falhou (exit code preservado)"
            cat "$DEPLOY_LOG"
            exit 1
          fi
          cat "$DEPLOY_LOG"

          DEPLOY_URL="$(grep -oE 'https://[A-Za-z0-9._-]+\.vercel\.app' "$DEPLOY_LOG" | tail -1 || true)"
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::deploy terminou 0 mas nao imprimiu URL Vercel valida"
            exit 1
          fi
          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Um `vercel deploy` bem-sucedido não prova que o runtime de produção
      # mudou. Aqui confirmamos, pela API, que o deployment ficou READY, que o
      # alvo é production e que o SHA publicado é o mesmo do commit em `main`.
      - name: Verify production deployment
        run: |
          set -euo pipefail

          DEPLOY_HOST="${DEPLOY_URL#https://}"
          API="https://api.vercel.com/v13/deployments/${DEPLOY_HOST}"
          if [ -n "${VERCEL_ORG_ID:-}" ]; then
            API="${API}?teamId=${VERCEL_ORG_ID}"
          fi

          RESPONSE="$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" "$API")"

          RESPONSE="$RESPONSE" EXPECTED_SHA="$GITHUB_SHA" node -e '
            const data = JSON.parse(process.env.RESPONSE ?? "{}");
            const expected = process.env.EXPECTED_SHA ?? "";
            const readyState = data.readyState ?? data.status ?? "";
            const target = data.target ?? "";
            const sha = data.meta?.githubCommitSha ?? "";
            const fail = (message) => {
              process.stderr.write("::error::" + message + "\n");
              process.exitCode = 1;
            };

            process.stdout.write(`readyState=${readyState} target=${target} sha=${sha}\n`);

            if (readyState !== "READY") fail(`deployment nao esta READY: ${readyState || "desconhecido"}`);
            if (target !== "production") fail(`deployment nao e production: ${target || "desconhecido"}`);
            if (!sha) fail("deployment sem githubCommitSha — nao da para provar a versao publicada");
            else if (sha !== expected) fail(`SHA divergente: publicado=${sha} esperado=${expected}`);
          '
        env:
          DEPLOY_URL: ${{ steps.vercel-prod.outputs.deploy-url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      - name: Production Summary
        run: |
          echo "### Production Deploy (main)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps.vercel-prod.outputs.deploy-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: main" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
