# .github/workflows/ci-main.yml
name: CI (main -> production)

on:
  push:
    branches: ["main"]

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  packages: write   # Necessário para push ao GitHub Container Registry (ghcr.io)

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/matheuswillock/lead-flow-app

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Governance Check
        run: bun run governance:check

      - name: Governance Allowlist Warnings
        run: bun run governance:warn-allowlist

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  build-and-push:
    name: Build Docker Image & Push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      # Migrations usam DIRECT_URL para evitar pooler do PgBouncer
      - name: Run Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: bunx prisma migrate deploy

      # Docker Buildx para suporte a cache de registry
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Autentica no GHCR com GITHUB_TOKEN automático — nenhum secret adicional
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gera tags e labels OCI para a imagem
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha,prefix=prod-,format=short

      # Build multi-stage + push para GHCR
      # NEXT_PUBLIC_* são passados como build-args (baked no bundle em build-time)
      # Cache de registry acelera builds subsequentes sem consumir cota do GHA cache
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_ENCRYPTION_KEY=${{ secrets.NEXT_PUBLIC_ENCRYPTION_KEY }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '' }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-production:
    name: Deploy Hostinger (Production)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.HOSTINGER_HOST }}
      DEPLOY_USER: ${{ secrets.HOSTINGER_USER }}
      DEPLOY_PORT: ${{ secrets.HOSTINGER_PORT || '22' }}
      COMPOSE_PATH: /opt/lead-flow
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Grava o .env no VPS com todos os secrets de runtime
      # O arquivo .env nunca entra na imagem Docker — apenas no VPS em disco
      - name: Write .env on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p $COMPOSE_PATH && cat > $COMPOSE_PATH/.env << 'ENVEOF'
          NODE_ENV=production
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_LEAD_ATTACHMENTS_BUCKET=${{ secrets.SUPABASE_LEAD_ATTACHMENTS_BUCKET }}
          SUPABASE_PROFILE_ICONS_BUCKET=${{ secrets.SUPABASE_PROFILE_ICONS_BUCKET }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DIRECT_URL=${{ secrets.DIRECT_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_TEST_MODE=${{ secrets.EMAIL_TEST_MODE || 'false' }}
          RESEND_OWNER_EMAIL=${{ secrets.RESEND_OWNER_EMAIL }}
          SUPPORT_EMAIL=${{ secrets.SUPPORT_EMAIL }}
          ASAAS_API_KEY=${{ secrets.ASAAS_API_KEY }}
          ASAAS_WALLET_ID=${{ secrets.ASAAS_WALLET_ID }}
          ASAAS_WEBHOOK_TOKEN=${{ secrets.ASAAS_WEBHOOK_TOKEN }}
          ASAAS_ENV=${{ secrets.ASAAS_ENV || 'production' }}
          ASAAS_URL=${{ secrets.ASAAS_URL }}
          ASAAS_URL_sandbox=${{ secrets.ASAAS_URL_sandbox }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '' }}
          NEXT_API_BASE_URL=${{ secrets.NEXT_API_BASE_URL || '/api/v1' }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          NEXT_PUBLIC_ENCRYPTION_KEY=${{ secrets.NEXT_PUBLIC_ENCRYPTION_KEY }}
          INTEGRATIONS_ENCRYPTION_KEY=${{ secrets.INTEGRATIONS_ENCRYPTION_KEY }}
          META_APP_SECRET=${{ secrets.META_APP_SECRET || '' }}
          META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN || '' }}
          META_VERIFY_TOKEN=${{ secrets.META_VERIFY_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
          ENVEOF"

      # Faz pull da nova imagem e reinicia via Docker Compose
      # GITHUB_TOKEN tem permissão de leitura no GHCR do mesmo repositório
      - name: Deploy via Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=no \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "
              echo '${{ secrets.GITHUB_TOKEN }}' | \
                docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
              docker pull ${{ env.IMAGE_NAME }}:production && \
              docker compose -f $COMPOSE_PATH/docker-compose.yml up -d --remove-orphans && \
              docker logout ghcr.io && \
              docker image prune -f
            "

      - name: Production Summary
        run: |
          echo "### Production Deploy (main)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_NAME }}:production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **App URL:** ${{ secrets.NEXT_PUBLIC_APP_URL }}" >> $GITHUB_STEP_SUMMARY
