# .github/workflows/ci-bugfix.yml
name: CI (bugfix -> develop)

on:
  push:
    branches:
      - "bugfix/**"
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: ci-bugfix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint & Typecheck
    if: ${{ startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      governance-sync: ${{ steps['quality-result'].outputs['governance-sync'] }}
      governance-check: ${{ steps['quality-result'].outputs['governance-check'] }}
      lint: ${{ steps['quality-result'].outputs.lint }}
      typecheck: ${{ steps['quality-result'].outputs.typecheck }}
      quality-passed: ${{ steps['quality-result'].outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Governance Sync
        id: governance-sync
        continue-on-error: true
        run: |
          bun run governance:sync
          git diff --exit-code

      - name: Governance Check
        id: governance-check
        continue-on-error: true
        run: bun run governance:check

      - name: Governance Allowlist Warnings
        continue-on-error: true
        run: bun run governance:warn-allowlist

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck

      - name: Resolve Quality Result
        id: quality-result
        if: always()
        run: |
          echo "governance-sync=${{ steps['governance-sync'].outcome }}" >> "$GITHUB_OUTPUT"
          echo "governance-check=${{ steps['governance-check'].outcome }}" >> "$GITHUB_OUTPUT"
          echo "lint=${{ steps.lint.outcome }}" >> "$GITHUB_OUTPUT"
          echo "typecheck=${{ steps.typecheck.outcome }}" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps['governance-sync'].outcome }}" == "success" && "${{ steps['governance-check'].outcome }}" == "success" && "${{ steps.lint.outcome }}" == "success" && "${{ steps.typecheck.outcome }}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    name: Quality Gate
    if: ${{ startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - quality
    steps:
      - name: Enforce Quality Checks
        run: |
          if [[ "${{ needs.quality.outputs['quality-passed'] }}" != "true" ]]; then
            echo "::error::One or more quality checks failed."
            echo "governance:sync=${{ needs.quality.outputs['governance-sync'] }}"
            echo "governance:check=${{ needs.quality.outputs['governance-check'] }}"
            echo "lint=${{ needs.quality.outputs.lint }}"
            echo "typecheck=${{ needs.quality.outputs.typecheck }}"
            exit 1
          fi

  migration-status:
    name: Migration Status
    if: ${{ startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Check Migration Status
        run: bun run db:migrate:status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

  build:
    name: Build
    if: ${{ startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - migration-status
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun store
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '!node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-
            ${{ runner.os }}-next-

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'placeholder-resend-key' }}
        run: bun run build

  deploy-preview:
    name: Deploy Vercel (Preview)
    if: ${{ startsWith(github.ref, 'refs/heads/bugfix/') || startsWith(github.ref, 'refs/heads/fix/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel (Preview)
        id: vercel-preview
        run: |
          DEPLOY_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes \
            2>&1 | tail -1)
          echo "preview-url=$DEPLOY_URL" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Preview Summary
        run: |
          echo "### Preview Deploy (bugfix)" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ steps['vercel-preview'].outputs['preview-url'] }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

  auto-pr-to-develop:
    name: Open PR to develop
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/heads/bugfix/') ||
          startsWith(github.ref, 'refs/heads/fix/')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality
      - quality-gate
      - build
      - deploy-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR if not exists (bugfix -> develop)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'develop';
            const checks = {
              governanceSync: '${{ needs.quality.outputs['governance-sync'] }}',
              governanceCheck: '${{ needs.quality.outputs['governance-check'] }}',
              lint: '${{ needs.quality.outputs.lint }}',
              typecheck: '${{ needs.quality.outputs.typecheck }}',
              build: '${{ needs.build.result }}',
              deployPreview: '${{ needs['deploy-preview'].result }}',
            };
            const isSuccess = (status) => status === 'success';
            const checklistLine = (status, label) => `- [${isSuccess(status) ? 'x' : ' '}] ${isSuccess(status) ? '✅' : '❌'} ${label}`;
            const replaceChecklistLine = (template, currentLabel, status, nextLabel) => {
              return template
                .split('\n')
                .map((line) => {
                  const normalizedLabel = line
                    .trim()
                    .replace(/^- \[[ x]\](?: ✅| ❌)? /, '');

                  return normalizedLabel === currentLabel ? checklistLine(status, nextLabel) : line;
                })
                .join('\n');
            };
            const applyChecklistStatuses = (template) => {
              let body = template;
              body = replaceChecklistLine(body, '`bun run governance:sync`', checks.governanceSync, '`bun run governance:sync`');
              body = replaceChecklistLine(body, '`bun run governance:check`', checks.governanceCheck, '`bun run governance:check`');
              body = replaceChecklistLine(body, '`bun run typecheck`', checks.typecheck, '`bun run typecheck`');
              body = replaceChecklistLine(body, '`bun run lint`', checks.lint, '`bun run lint`');
              body = replaceChecklistLine(body, 'Manteve adapters sincronizados (`bun run governance:sync`)?', checks.governanceSync, 'Manteve adapters sincronizados (`bun run governance:sync`)?');
              body = replaceChecklistLine(body, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?', checks.governanceSync, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?');
              return body;
            };
            const automationSection = (message) => [
              '<!-- ci-bugfix:automation:start -->',
              '## CI Automation',
              '',
              `**Head:** \`${head}\``,
              `**Base:** \`${base}\``,
              '',
              checklistLine(checks.build, 'Build OK'),
              checklistLine(checks.deployPreview, 'Preview deploy OK'),
              '',
              message,
              '<!-- ci-bugfix:automation:end -->'
            ].join('\n');
            const upsertAutomationSection = (body, message) => {
              const startMarker = '<!-- ci-bugfix:automation:start -->';
              const endMarker = '<!-- ci-bugfix:automation:end -->';
              const nextSection = automationSection(message);

              if (body.includes(startMarker) && body.includes(endMarker)) {
                return body.replace(
                  /<!-- ci-bugfix:automation:start -->[\s\S]*?<!-- ci-bugfix:automation:end -->/,
                  nextSection
                );
              }

              return [body.trimEnd(), '', nextSection].join('\n');
            };

            if (head === base) {
              core.info(`Head e base são iguais (${head}). Sem PR.`);
              return;
            }

            const prs = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (prs.data.length > 0) {
              core.info(`PR já existe: #${prs.data[0].number} ${prs.data[0].html_url}`);
              const existingPr = prs.data[0];
              const fallbackTemplate = fs.readFileSync('.github/pull_request_template.md', 'utf8');
              let body = applyChecklistStatuses(existingPr.body || fallbackTemplate);
              body = upsertAutomationSection(body, '*Atualizado automaticamente pelo GitHub Actions.*');

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPr.number,
                body,
              });

              core.info(`PR atualizado: #${existingPr.number} ${existingPr.html_url}`);
              return;
            }

            const cmp = await github.rest.repos.compareCommits({
              owner,
              repo,
              base,
              head,
            });

            if ((cmp.data.ahead_by || 0) === 0) {
              core.info(`${head} não está à frente de ${base}. Sem PR.`);
              return;
            }

            const title = `fix: ${head.replace(/^bugfix\//,'').replace(/^fix\//,'')}`;
            let body = applyChecklistStatuses(fs.readFileSync('.github/pull_request_template.md', 'utf8'));
            body = upsertAutomationSection(body, '*Criado automaticamente pelo GitHub Actions.*');

            const res = await github.rest.pulls.create({
              owner, repo,
              head,
              base,
              title,
              body,
              maintainer_can_modify: true,
            });

            core.info(`PR criado: #${res.data.number} ${res.data.html_url}`);
