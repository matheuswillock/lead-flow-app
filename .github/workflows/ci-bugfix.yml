# .github/workflows/ci-bugfix.yml
name: CI (bugfix -> develop)

on:
  push:
    branches:
      - "bugfix/**"
      - "fix/**"
  workflow_dispatch:

concurrency:
  group: ci-bugfix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-branch-reusable.yml
    with:
      pr-base: develop
      concurrency-group: ci-bugfix
      automation-marker: ci-bugfix:automation
      pr-title-prefix: fix
      branch-strip-prefixes: bugfix/,fix/
      run-spellcheck: true
      skip-build-on-github-rebase: true
    secrets: inherit
