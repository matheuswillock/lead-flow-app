name: Sync develop ← main

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-sync-develop
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: features/sync-main-to-develop

jobs:
  sync-develop:
    name: Merge main → develop
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Merge main into develop
        run: |
          git merge origin/main --no-ff -m "chore: sync develop ← main" || {
            CONFLICTS=$(git status --porcelain | grep "^UU")
            COUNT=$(echo "$CONFLICTS" | grep -c "^UU" || true)

            if [ "$COUNT" -eq 1 ] && echo "$CONFLICTS" | grep -q "^UU package.json"; then
              git checkout --theirs package.json
              git add package.json
              git commit -m "chore: sync develop ← main (package.json version from main)"
            else
              echo "::error::Unexpected merge conflicts. Manual resolution required:"
              git status --porcelain
              git merge --abort
              exit 1
            fi
          }

      - name: Align develop package.json version with main
        run: |
          MAIN_VERSION=$(git show origin/main:package.json | node -e \
            "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")
          CURRENT_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")

          if [ "$CURRENT_VERSION" != "$MAIN_VERSION" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$MAIN_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git add package.json
            git commit -m "chore: align develop package.json to main v$MAIN_VERSION"
          fi

      - name: Push sync branch
        run: |
          git checkout -B "$SYNC_BRANCH"
          git push origin "$SYNC_BRANCH" --force-with-lease

      - name: Create or update PR to develop
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ env.SYNC_BRANCH }}
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.SYNC_BRANCH;
            const base = 'develop';
            const title = 'chore: sync develop ← main';
            const body = [
              '## Summary',
              'Sincronização automática de `main` em `develop` após merge em produção.',
              '',
              '- Merge de `origin/main` aplicado sobre `develop`',
              '- `package.json` alinhado à versão de `main`',
              '',
              'Aguardar CI verde e mergear este PR (branch protection exige PR + checks).',
            ].join('\n');

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (prs.length > 0) {
              const pr = prs[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                title,
                body,
              });
              core.info(`PR atualizado: #${pr.number} ${pr.html_url}`);
              return;
            }

            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body,
            });
            core.info(`PR criado: #${pr.number} ${pr.html_url}`);

      - name: Summary
        run: |
          echo "### Sync develop ← main" >> $GITHUB_STEP_SUMMARY
          echo "- Branch \`$SYNC_BRANCH\` atualizada com merge de main" >> $GITHUB_STEP_SUMMARY
          echo "- PR aberto/atualizado para \`develop\` (push direto bloqueado por branch protection)" >> $GITHUB_STEP_SUMMARY
