name: Sync develop ← main

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-sync-develop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-develop:
    name: Merge main → develop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Merge main into develop
        run: |
          git merge origin/main --no-edit || {
            CONFLICTS=$(git status --porcelain | grep "^UU")
            COUNT=$(echo "$CONFLICTS" | grep -c "^UU" || true)

            if [ "$COUNT" -eq 1 ] && echo "$CONFLICTS" | grep -q "^UU package.json"; then
              git checkout --ours package.json
              git add package.json
              git commit -m "chore: sync develop ← main (auto-resolved package.json version)"
            else
              echo "::error::Unexpected merge conflicts. Manual resolution required:"
              git status --porcelain
              git merge --abort
              exit 1
            fi
          }

      - name: Push develop
        run: git push origin develop

      - name: Summary
        run: |
          echo "### Sync develop ← main" >> $GITHUB_STEP_SUMMARY
          echo "- develop atualizado com os commits de main" >> $GITHUB_STEP_SUMMARY
