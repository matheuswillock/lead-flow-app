name: Sync develop ← main

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-sync-develop
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync-develop:
    name: Merge main → develop
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Merge main into develop
        run: |
          git merge origin/main --no-ff -m "chore: sync develop ← main [skip ci]" || {
            CONFLICTS=$(git status --porcelain | grep "^UU")
            COUNT=$(echo "$CONFLICTS" | grep -c "^UU" || true)

            if [ "$COUNT" -eq 1 ] && echo "$CONFLICTS" | grep -q "^UU package.json"; then
              git checkout --theirs package.json
              git add package.json
              git commit -m "chore: sync develop ← main (package.json version from main) [skip ci]"
            else
              echo "::error::Unexpected merge conflicts. Manual resolution required:"
              git status --porcelain
              git merge --abort
              exit 1
            fi
          }

      - name: Align develop package.json version with main
        run: |
          MAIN_VERSION=$(git show origin/main:package.json | node -e \
            "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).version))")
          CURRENT_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")

          if [ "$CURRENT_VERSION" != "$MAIN_VERSION" ]; then
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = '$MAIN_VERSION';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            git add package.json
            git commit -m "chore: align develop package.json to main v$MAIN_VERSION [skip ci]"
          fi

      - name: Push develop
        run: |
          # Ensure HEAD carries [skip ci] so ci-develop does not re-fire after a sync.
          # A fast-forward brings main's merge commit which lacks [skip ci], triggering
          # a spurious release PR with only a version bump — this prevents that.
          LAST_MSG=$(git log -1 --format="%s")
          if ! echo "$LAST_MSG" | grep -q "\[skip ci\]"; then
            git commit --allow-empty -m "chore: sync develop ← main [skip ci]"
          fi
          git push origin develop

      - name: Summary
        run: |
          echo "### Sync develop ← main" >> $GITHUB_STEP_SUMMARY
          echo "- develop atualizado com os commits de main" >> $GITHUB_STEP_SUMMARY
