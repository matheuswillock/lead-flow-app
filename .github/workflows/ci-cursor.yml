# .github/workflows/ci-cursor.yml
name: CI (cursor -> develop)

on:
  push:
    branches:
      - "cursor/**"
  workflow_dispatch:

concurrency:
  group: ci-cursor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  deployments: write

jobs:
  ci:
    uses: ./.github/workflows/ci-branch-reusable.yml
    with:
      pr-base: develop
      concurrency-group: ci-cursor
      automation-marker: ci-cursor:automation
      pr-title-prefix: cursor
      branch-strip-prefixes: cursor/
      run-spellcheck: true
      skip-build-on-github-rebase: true
    secrets: inherit
