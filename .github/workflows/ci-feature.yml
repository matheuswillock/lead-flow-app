# .github/workflows/ci-feature.yml
name: CI (feature -> develop)

on:
  push:
    branches:
      - "feature/**"
      - "features/**"
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: ci-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  deployments: write

jobs:
  ci:
    uses: ./.github/workflows/ci-branch-reusable.yml
    with:
      pr-base: develop
      concurrency-group: ci-feature
      automation-marker: ci-feature:automation
      pr-title-prefix: feat
      branch-strip-prefixes: features/,feature/,feat/
      run-spellcheck: true
      skip-build-on-github-rebase: true
    secrets: inherit
