# .github/workflows/ci-feature.yml
name: CI (feature -> develop)

on:
  push:
    branches:
      - "feature/**"
      - "features/**"
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: ci-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: write
  deployments: write

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  lint-and-governance:
    name: Lint & Governance
    if: >-
      ${{
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    outputs:
      governance-sync: ${{ steps.resolve.outputs['governance-sync'] }}
      governance-check: ${{ steps.resolve.outputs['governance-check'] }}
      lint: ${{ steps.resolve.outputs.lint }}
      passed: ${{ steps.resolve.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Governance Sync
        id: governance-sync
        continue-on-error: true
        run: |
          bun run governance:sync
          git diff --exit-code

      - name: Governance Check
        id: governance-check
        continue-on-error: true
        run: bun run governance:check

      - name: Governance Allowlist Warnings
        continue-on-error: true
        run: bun run governance:warn-allowlist

      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint

      - name: Resolve Result
        id: resolve
        if: always()
        run: |
          echo "governance-sync=${{ steps['governance-sync'].outcome }}" >> "$GITHUB_OUTPUT"
          echo "governance-check=${{ steps['governance-check'].outcome }}" >> "$GITHUB_OUTPUT"
          echo "lint=${{ steps.lint.outcome }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps['governance-sync'].outcome }}" == "success" && "${{ steps['governance-check'].outcome }}" == "success" && "${{ steps.lint.outcome }}" == "success" ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  typecheck:
    name: Typecheck
    if: >-
      ${{
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: bun run typecheck

  tests:
    name: Tests
    if: >-
      ${{
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Proxy Tests
        id: proxy-tests
        continue-on-error: true
        run: bun run test:proxy

      - name: Unit Tests
        id: unit-tests
        continue-on-error: true
        run: bun run test

      - name: Resolve Tests
        if: always()
        run: |
          if [[ "${{ steps['proxy-tests'].outcome }}" != "success" || "${{ steps['unit-tests'].outcome }}" != "success" ]]; then
            echo "::error::proxy-tests=${{ steps['proxy-tests'].outcome }} unit-tests=${{ steps['unit-tests'].outcome }}"
            exit 1
          fi

  spellcheck:
    name: Spellcheck PT-BR
    if: >-
      ${{
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Spellcheck PT-BR
        run: bun run lint:pt-br

  build:
    name: Build
    # Só 1 runner tem label lead-flow-build → next build serializado (FIFO real).
    # Pulado em rebases feitos pela UI do GitHub (committer noreply@github.com).
    if: >-
      ${{
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        ) &&
        github.event.head_commit.committer.email != 'noreply@github.com'
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Bun & deps
        uses: ./.github/actions/setup-bun-deps

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}-

      - name: Generate Prisma Client
        run: bun run prisma:generate

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'placeholder-resend-key' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: bun run build

  quality-gate:
    name: Quality Gate
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 2
    needs:
      - lint-and-governance
      - typecheck
      - tests
      - spellcheck
      - build
    steps:
      - name: Enforce Quality Checks
        run: |
          failed=0
          if [[ "${{ needs['lint-and-governance'].outputs.passed }}" != "true" ]]; then
            echo "::error::Lint and/or governance checks failed."
            echo "governance:sync=${{ needs['lint-and-governance'].outputs['governance-sync'] }}"
            echo "governance:check=${{ needs['lint-and-governance'].outputs['governance-check'] }}"
            echo "lint=${{ needs['lint-and-governance'].outputs.lint }}"
            failed=1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "::error::Typecheck failed."
            failed=1
          fi
          if [[ "${{ needs.tests.result }}" != "success" ]]; then
            echo "::error::Tests failed."
            failed=1
          fi
          if [[ "${{ needs.spellcheck.result }}" != "success" ]]; then
            echo "::error::Spellcheck PT-BR failed."
            failed=1
          fi
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then
            echo "::error::Build failed."
            failed=1
          fi
          exit "$failed"

  auto-pr-to-develop:
    name: Open PR to develop
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/features/') ||
          startsWith(github.ref, 'refs/heads/feat/')
        ) &&
        (
          github.event.head_commit == null ||
          !contains(github.event.head_commit.message, '[skip ci]')
        )
      }}
    runs-on: [self-hosted, linux, x64, lead-flow-ci]
    timeout-minutes: 10
    needs:
      - lint-and-governance
      - typecheck
      - quality-gate
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR Description (OpenAI)
        id: generate-pr-description
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/generate-pr-description.py

      - name: Create PR if not exists (feature -> develop)
        uses: actions/github-script@v7
        env:
          CLAUDE_DESCRIPTION: ${{ steps['generate-pr-description'].outputs['pr-description'] }}
        with:
          github-token: ${{ secrets.PR_AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = context.ref.replace('refs/heads/', '');
            const base = 'develop';
            const claudeDescription = process.env.CLAUDE_DESCRIPTION || '';
            const checks = {
              governanceSync: '${{ needs['lint-and-governance'].outputs['governance-sync'] }}',
              governanceCheck: '${{ needs['lint-and-governance'].outputs['governance-check'] }}',
              lint: '${{ needs['lint-and-governance'].outputs.lint }}',
              typecheck: '${{ needs.typecheck.result }}',
              build: '${{ needs.build.result }}',
            };
            const isSuccess = (status) => status === 'success';
            const checklistLine = (status, label) => `- [${isSuccess(status) ? 'x' : ' '}] ${isSuccess(status) ? '✅' : '❌'} ${label}`;
            const replaceChecklistLine = (template, currentLabel, status, nextLabel) => {
              return template
                .split('\n')
                .map((line) => {
                  const normalizedLabel = line
                    .trim()
                    .replace(/^- \[[ x]\](?: ✅| ❌)? /, '');

                  return normalizedLabel === currentLabel ? checklistLine(status, nextLabel) : line;
                })
                .join('\n');
            };
            const applyChecklistStatuses = (template) => {
              let body = template;
              body = replaceChecklistLine(body, '`bun run governance:sync`', checks.governanceSync, '`bun run governance:sync`');
              body = replaceChecklistLine(body, '`bun run governance:check`', checks.governanceCheck, '`bun run governance:check`');
              body = replaceChecklistLine(body, '`bun run typecheck`', checks.typecheck, '`bun run typecheck`');
              body = replaceChecklistLine(body, '`bun run lint`', checks.lint, '`bun run lint`');
              body = replaceChecklistLine(body, 'Manteve adapters sincronizados (`bun run governance:sync`)?', checks.governanceSync, 'Manteve adapters sincronizados (`bun run governance:sync`)?');
              body = replaceChecklistLine(body, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?', checks.governanceSync, 'Confirmou sincronizacao do `AGENTS.md` gerado para Codex?');
              return body;
            };
            const applyClaudeDescription = (body) => {
              if (!claudeDescription.trim()) return body;
              return body.replace(
                /^(- Summary of changes:.*\n- Why this change is needed:.*)/m,
                claudeDescription.trim()
              );
            };
            const shouldApplyClaudeDescription = (body) =>
              body.includes('<seus bullet points aqui>') ||
              body.includes('<sua frase aqui>');
            const automationSection = (message) => [
              '<!-- ci-feature:automation:start -->',
              '## CI Automation',
              '',
              `**Head:** \`${head}\``,
              `**Base:** \`${base}\``,
              '',
              checklistLine(checks.build, 'Build OK'),
              '',
              message,
              '<!-- ci-feature:automation:end -->'
            ].join('\n');
            const upsertAutomationSection = (body, message) => {
              const startMarker = '<!-- ci-feature:automation:start -->';
              const endMarker = '<!-- ci-feature:automation:end -->';
              const nextSection = automationSection(message);

              if (body.includes(startMarker) && body.includes(endMarker)) {
                return body.replace(
                  /<!-- ci-feature:automation:start -->[\s\S]*?<!-- ci-feature:automation:end -->/,
                  nextSection
                );
              }

              return [body.trimEnd(), '', nextSection].join('\n');
            };

            if (head === base) {
              core.info(`Head e base são iguais (${head}). Sem PR.`);
              return;
            }

            const prs = await github.rest.pulls.list({
              owner, repo,
              head: `${owner}:${head}`,
              base,
              state: 'open',
              per_page: 1,
            });

            if (prs.data.length > 0) {
              core.info(`PR já existe: #${prs.data[0].number} ${prs.data[0].html_url}`);
              const existingPr = prs.data[0];
              const fallbackTemplate = fs.readFileSync('.github/pull_request_template.md', 'utf8');
              let body = applyChecklistStatuses(existingPr.body || fallbackTemplate);
              if (shouldApplyClaudeDescription(body)) {
                body = applyClaudeDescription(body);
              }
              body = upsertAutomationSection(body, '*Atualizado automaticamente pelo GitHub Actions.*');

              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existingPr.number,
                body,
              });

              core.info(`PR atualizado: #${existingPr.number} ${existingPr.html_url}`);
              return;
            }

            const cmp = await github.rest.repos.compareCommits({
              owner,
              repo,
              base,
              head,
            });

            if ((cmp.data.ahead_by || 0) === 0) {
              core.info(`${head} não está à frente de ${base}. Sem PR.`);
              return;
            }

            const title = `feat: ${head.replace(/^features\//,'').replace(/^feature\//,'').replace(/^feat\//,'')}`;
            let body = applyChecklistStatuses(fs.readFileSync('.github/pull_request_template.md', 'utf8'));
            body = applyClaudeDescription(body);
            body = upsertAutomationSection(body, '*Criado automaticamente pelo GitHub Actions.*');

            const res = await github.rest.pulls.create({
              owner, repo,
              head,
              base,
              title,
              body,
              maintainer_can_modify: true,
            });

            core.info(`PR criado: #${res.data.number} ${res.data.html_url}`);
