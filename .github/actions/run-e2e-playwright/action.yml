name: Run integration + Playwright E2E
description: >-
  Sobe Postgres supabase/postgres, aplica migrations (seed E2E), roda
  bun run test:integration e depois build, Chromium e bun run test:e2e.
inputs:
  include-slow:
    description: Incluir testes @slow (develop/main)
    required: false
    default: "false"
  asaas-sandbox-api-key:
    description: Chave Asaas sandbox (nunca produção). Placeholder se vazio.
    required: false
    default: ""
  github-token:
    description: Token usado só para autenticar o pull no ghcr.io (limite de taxa maior que o anônimo).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Runner self-hosted (VPS) é persistente: psql e as libs do Chromium são
    # pré-instaladas pelo owner uma única vez, e o apt aqui seria repetição
    # (além de exigir sudo passwordless, que a VPS não tem). O apt só roda no
    # caminho ubuntu-latest (VM descartável), onde psql nunca existe.
    - name: Install PostgreSQL client (somente quando ausente)
      shell: bash
      # Acquire::Retries/Timeout evita travar indefinidamente quando um mirror
      # (ex. azure.archive.ubuntu.com) fica sem responder — sem isso, apt-get
      # update pode ficar pendurado até o job inteiro bater no timeout.
      run: |
        set -euo pipefail
        if command -v psql >/dev/null 2>&1; then
          echo "psql já disponível: $(psql --version)"
          exit 0
        fi
        # O runner ubuntu-latest traz o repo apt do Chrome da Google, que este
        # job NÃO usa (o Chromium vem do cache do Playwright) — e as
        # republicações da Google produzem "Hash Sum mismatch" que derruba o
        # apt-get update inteiro com exit 100 (3 runs seguidas em 09/09/2026).
        # Remover o source de terceiro antes do update imuniza o job.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
          /etc/apt/sources.list.d/google-chrome.sources
        sudo apt-get update -y \
          -o Acquire::Retries=3 \
          -o Acquire::http::Timeout=15 \
          -o Acquire::https::Timeout=15
        sudo apt-get install -y postgresql-client

    # Cache do tar da imagem: evita o pull (e o rate limit do ghcr.io) nos runs
    # seguintes. A chave carrega a tag da imagem, então trocar a versão invalida.
    - name: Cache supabase/postgres image
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/e2e-postgres-image.tar
        key: e2e-postgres-image-${{ runner.os }}-17.6.1.149

    - name: Start supabase/postgres
      shell: bash
      env:
        GHCR_TOKEN: ${{ inputs.github-token }}
        GHCR_ACTOR: ${{ github.actor }}
        E2E_PG_IMAGE_TAR: ${{ runner.temp }}/e2e-postgres-image.tar
      # O nome único evita colisão com containers órfãos em retries. A porta
      # permanece fixa em 55322 porque scripts/seed-e2e.ts,
      # scripts/lib/local-stack.ts e .env.test.example dependem dela. Nos
      # runners hospedados, cada job possui uma VM e uma rede Docker isoladas.
      run: |
        set -euo pipefail
        E2E_PG_CONTAINER="e2e-postgres-${{ github.run_id }}-${{ github.run_attempt }}"
        echo "E2E_PG_CONTAINER=${E2E_PG_CONTAINER}" >> "$GITHUB_ENV"

        # Remove containers órfãos de uma tentativa anterior no mesmo runner.
        for c in $(docker ps -aq --filter "name=e2e-postgres" 2>/dev/null); do
          echo "Removendo container e2e-postgres órfão: $(docker inspect --format '{{.Name}} (criado {{.Created}})' "$c")"
          docker rm -f "$c" >/dev/null 2>&1 || true
        done

        # 55322 está na faixa de portas efêmeras do Linux (32768-60999): uma conexão de
        # saída de apt/npm/docker pull pode ocupá-la como porta de origem e o bind do
        # `docker run` falha com "address already in use" numa VM limpa. Reserva a porta
        # para novas conexões e repete o start se ela ainda assim estiver ocupada.
        sudo sysctl -w net.ipv4.ip_local_reserved_ports=55322 >/dev/null 2>&1 || true

        # O ghcr.io respondeu `toomanyrequests` em 22/10/2026 (runs 39830851161 e
        # 39838499413), até com 6 tentativas e backoff. Ordem: tar em cache →
        # pull autenticado (limite maior que o anônimo) → pull anônimo. O login
        # usa um DOCKER_CONFIG temporário para não gravar credencial no runner
        # persistente (VPS).
        E2E_PG_IMAGE="ghcr.io/supabase/postgres:17.6.1.149"
        if [ -s "${E2E_PG_IMAGE_TAR}" ] && docker load -i "${E2E_PG_IMAGE_TAR}"; then
          echo "Imagem ${E2E_PG_IMAGE} carregada do cache."
        else
          rm -f "${E2E_PG_IMAGE_TAR}"
          export DOCKER_CONFIG="${RUNNER_TEMP}/docker-config-ghcr"
          mkdir -p "${DOCKER_CONFIG}"
          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_ACTOR:-github-actions}" --password-stdin \
              || echo "Login no ghcr.io falhou; seguindo com pull anônimo."
          fi
          # 429 do ghcr.io persistiu por mais de uma hora em 22/10/2026 (medido
          # também fora do CI). A mesma tag existe no Docker Hub: alterna entre as
          # duas origens e re-etiqueta para o nome ghcr usado pelo `docker run`.
          E2E_PG_FALLBACK_IMAGE="docker.io/supabase/postgres:17.6.1.149"
          pulled=""
          pull_delay=10
          for pull_attempt in 1 2 3 4 5 6; do
            if docker pull "${E2E_PG_IMAGE}"; then
              pulled="ghcr"
              break
            fi
            echo "Pull de ${E2E_PG_IMAGE} falhou (tentativa ${pull_attempt}/6); tentando ${E2E_PG_FALLBACK_IMAGE}."
            if docker pull "${E2E_PG_FALLBACK_IMAGE}"; then
              docker tag "${E2E_PG_FALLBACK_IMAGE}" "${E2E_PG_IMAGE}"
              pulled="dockerhub"
              break
            fi
            if [ "${pull_attempt}" = "6" ]; then
              echo "::error::Não foi possível baixar a imagem do Postgres E2E (ghcr.io e Docker Hub) após 6 tentativas."
              exit 1
            fi
            echo "Nova tentativa em ${pull_delay}s."
            sleep "${pull_delay}"
            pull_delay=$((pull_delay * 2))
          done
          echo "Imagem do Postgres E2E obtida via ${pulled}."
          docker save "${E2E_PG_IMAGE}" -o "${E2E_PG_IMAGE_TAR}" || rm -f "${E2E_PG_IMAGE_TAR}"
          unset DOCKER_CONFIG
        fi

        start_postgres() {
          docker run -d --name "${E2E_PG_CONTAINER}" \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 55322:5432 \
            -v "$PWD/docker/local/zz-init-auth-stub-schema.sql:/docker-entrypoint-initdb.d/zz-init-auth-stub-schema.sql:ro" \
            -v "$PWD/docker/local/zz-init-storage-stub-schema.sql:/docker-entrypoint-initdb.d/zz-init-storage-stub-schema.sql:ro" \
            "${E2E_PG_IMAGE}" \
            postgres \
            -c listen_addresses=* \
            -c wal_level=logical \
            -c max_connections=50
        }

        for attempt in 1 2 3; do
          if start_postgres; then
            break
          fi
          if [ "${attempt}" = "3" ]; then
            echo "::error::Não foi possível subir o Postgres E2E na porta 55322 após 3 tentativas."
            ss -ltnp 2>/dev/null | grep ':55322' || true
            exit 1
          fi
          echo "Start do Postgres E2E falhou (tentativa ${attempt}/3); removendo o container e repetindo."
          docker rm -f "${E2E_PG_CONTAINER}" >/dev/null 2>&1 || true
          sleep 5
        done
        for i in $(seq 1 60); do
          if pg_isready -h 127.0.0.1 -p 55322 -U postgres >/dev/null 2>&1; then
            echo "Postgres E2E pronto."
            echo "=== catalog probe (storage/auth) ==="
            PGPASSWORD=postgres psql -h 127.0.0.1 -p 55322 -U postgres -d postgres -c "
              SELECT
                to_regclass('storage.buckets') AS buckets,
                to_regclass('storage.objects') AS objects,
                to_regclass('auth.identities') AS identities,
                EXISTS (
                  SELECT 1
                  FROM information_schema.columns
                  WHERE table_schema = 'auth'
                    AND table_name = 'users'
                    AND column_name = 'email_change_token_current'
                ) AS email_change_token_current;
            "
            exit 0
          fi
          sleep 2
        done
        echo "::error::Postgres E2E não ficou pronto em 120s."
        docker logs "${E2E_PG_CONTAINER}" || true
        exit 1

    - name: Export .env.test.example
      shell: bash
      run: |
        set -euo pipefail
        grep -v '^#' .env.test.example | grep -v '^$' >> "$GITHUB_ENV"

    - name: Override CI E2E secrets
      shell: bash
      env:
        ASAAS_SANDBOX_API_KEY_INPUT: ${{ inputs.asaas-sandbox-api-key }}
        INCLUDE_SLOW: ${{ inputs.include-slow }}
      run: |
        set -euo pipefail
        {
          echo "CI=true"
          echo "APP_ENV=test"
          echo "E2E_TEST_MODE=true"
          echo "E2E_INCLUDE_SLOW=${INCLUDE_SLOW}"
          echo "ASAAS_ENV=sandbox"
          echo "ASAAS_URL=https://sandbox.asaas.com"
          echo "ASAAS_URL_sandbox=https://sandbox.asaas.com"
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres"
          echo "DIRECT_URL=postgresql://postgres:postgres@127.0.0.1:55322/postgres"
          if [[ -n "${ASAAS_SANDBOX_API_KEY_INPUT}" ]]; then
            echo "ASAAS_API_KEY=${ASAAS_SANDBOX_API_KEY_INPUT}"
            echo "ASAAS_SANDBOX_API_KEY=${ASAAS_SANDBOX_API_KEY_INPUT}"
          fi
        } >> "$GITHUB_ENV"

    - name: Cache Playwright Chromium
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock', 'bun.lockb') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Chromium
      shell: bash
      # `--with-deps` roda `apt-get` via sudo — só funciona onde há sudo
      # passwordless (ubuntu-latest). Na VPS as libs de sistema do Chromium
      # foram instaladas pelo owner (`npx playwright install-deps chromium`)
      # e o download do browser sozinho não precisa de sudo. Em runner
      # persistente, ~/.cache/ms-playwright também sobrevive entre runs.
      run: |
        set -euo pipefail
        if sudo -n true 2>/dev/null; then
          bunx --bun playwright install --with-deps chromium
        else
          bunx --bun playwright install chromium
        fi

    # Os wrappers de prioridade mantêm a action portátil para runners locais.
    # Em ubuntu-latest a VM é isolada, portanto não há disputa com outro job.
    - name: Seed E2E database
      shell: bash
      run: |
        set -euo pipefail
        if command -v ionice >/dev/null 2>&1; then
          ionice -c3 nice -n 19 bun run db:seed:e2e
        else
          nice -n 19 bun run db:seed:e2e
        fi

    # Os testes de integração moram aqui, e não em um job próprio, porque tudo
    # de que precisam já foi montado pelos passos acima: Postgres supabase/postgres
    # em :55322, migrations aplicadas pelo `db:seed:e2e` e DATABASE_URL/DIRECT_URL
    # já exportados para o `$GITHUB_ENV` apontando para ele. Um job dedicado
    # duplicaria o `docker run` + `pg_isready` + seed — cerca de 60 linhas de
    # infraestrutura idêntica — sem cobrir nada a mais.
    #
    # Vêm ANTES do build de propósito: a suíte roda em segundos e o `next build`
    # leva minutos. Falhar aqui economiza o build inteiro.
    #
    # `assertLocalDatabase()` em manager-account-users.integration.test.ts aborta
    # se DATABASE_URL não for 127.0.0.1/localhost — estes testes ESCREVEM no banco.
    - name: Integration tests (Postgres local)
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error title=E2E stage failed::Integration tests (Postgres local) failed."; { echo "## E2E: integration tests"; echo "bun run test:integration failed against the local Postgres."; } >> "$GITHUB_STEP_SUMMARY"' ERR
        echo "::group::E2E stage: integration tests"
        if command -v ionice >/dev/null 2>&1; then
          RUN_INTEGRATION="ionice -c3 nice -n 19"
        else
          RUN_INTEGRATION="nice -n 19"
        fi
        if ! ${RUN_INTEGRATION} bun run test:integration; then
          echo "::error title=Testes de integração reprovaram::bun run test:integration falhou. A falha é dos TESTES DE INTEGRAÇÃO contra o Postgres :55322, não do Playwright — este job hospeda os dois. Reproduza local com: bun run test:integration:local"
          exit 1
        fi
        echo "::endgroup::"

    - name: Build
      shell: bash
      run: |
        set -euo pipefail
        trap 'echo "::error title=E2E stage failed::The application build failed inside the E2E action."; { echo "## E2E: build"; echo "bun run build failed before Playwright started."; } >> "$GITHUB_STEP_SUMMARY"' ERR
        echo "::group::E2E stage: application build"
        if command -v ionice >/dev/null 2>&1; then
          ionice -c3 nice -n 19 bun run build
        else
          nice -n 19 bun run build
        fi
        echo "::endgroup::"

    - name: Run Playwright
      shell: bash
      # O `next start` (webServer) e o Chromium herdam ionice/nice do pai.
      run: |
        set -euo pipefail
        trap 'echo "::error title=E2E stage failed::Playwright tests failed. See the Playwright report artifact for the failing spec."; { echo "## E2E: Playwright"; echo "bun run test:e2e failed. Download the playwright-report artifact for the failing test and trace."; } >> "$GITHUB_STEP_SUMMARY"' ERR
        echo "::group::E2E stage: Playwright"
        if command -v ionice >/dev/null 2>&1; then
          ionice -c3 nice -n 19 bun run test:e2e
        else
          nice -n 19 bun run test:e2e
        fi
        echo "::endgroup::"

    - name: Stop postgres
      if: always()
      shell: bash
      run: |
        docker rm -f "${E2E_PG_CONTAINER:-e2e-postgres-inexistente}" >/dev/null 2>&1 || true
