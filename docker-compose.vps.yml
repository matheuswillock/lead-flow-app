# =============================================================================
# docker-compose.vps.yml — OpenWA Gateway + N8N (produção Hostinger)
# =============================================================================
#
# Stack unificada com rede compartilhada (OpenWA → N8N via http://n8n:5678).
# Banco N8N: Postgres local no container n8n-postgres (.env.n8n).
#
# Pré-requisitos na VPS:
#   - Caddy (ou outro proxy) em 443 → OpenWA e :5678
#   - deploy/hostinger/Caddyfile instalado em /etc/caddy/Caddyfile
#
# Uso:
#   cp .env.openwa.example .env.openwa   # preencher produção
#   cp .env.n8n.example .env.n8n           # preencher produção
#   bun run vps:up
#   bun run vps:logs
#
# =============================================================================

services:
  n8n:
    container_name: n8n
    image: docker.io/n8nio/n8n:2.28.5
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - studio-bot-net
    env_file:
      - .env.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n-postgres:
    container_name: n8n_postgres
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-n8n}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - listen_addresses=*
    volumes:
      - n8n_postgres:/var/lib/postgresql/data
    networks:
      - studio-bot-net
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  studio-bot-ops:
    container_name: studio_bot_ops
    build:
      context: ./deploy/hostinger
      dockerfile: studio-bot-ops/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    # Secrets e backup: somente em .env.ops (não use ${VAR} em environment — sobrescreve .env.ops com .env vazio/errado).
    env_file:
      - path: .env.ops
        required: false
    environment:
      OPS_AGENT_HOST: "0.0.0.0"
      OPS_AGENT_PORT: "9090"
      OPS_DEPLOY_DIR: /opt/lead-flow-bot
      OPS_COMPOSE_FILE: /opt/lead-flow-bot/docker-compose.vps.yml
    volumes:
      - /opt/lead-flow-bot:/opt/lead-flow-bot
      - /opt/lead-flow-app/backups:/opt/lead-flow-app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - studio-bot-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9090/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  openwa:
    build:
      context: ./deploy/openwa-gateway
      dockerfile: Dockerfile
    image: openwa-gateway:latest
    restart: unless-stopped
    env_file: .env.openwa
    volumes:
      - openwa_sessions_tmp:/app/.wwebjs_tmp
    networks:
      - studio-bot-net
    expose:
      - "3333"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  n8n_data:
  n8n_postgres:
  openwa_sessions_tmp:

networks:
  studio-bot-net:
    name: studio-bot-net
    driver: bridge
