# =============================================================================
# docker-compose.vps.yml — OpenWA Gateway (produção Hostinger)
# =============================================================================
#
# N8N/Evolution removidos (Bethânia não depende mais deles).
#
# Pré-requisitos na VPS:
#   - Caddy (ou outro proxy) em 443 → OpenWA
#   - deploy/hostinger/Caddyfile instalado em /etc/caddy/Caddyfile
#
# Uso:
#   cp .env.openwa.example .env.openwa   # preencher produção
#   bun run vps:up
#   bun run vps:logs
#
# =============================================================================

services:
  studio-bot-ops:
    container_name: studio_bot_ops
    build:
      context: ./deploy/hostinger
      dockerfile: studio-bot-ops/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    # Secrets e backup: somente em .env.ops (não use ${VAR} em environment — sobrescreve .env.ops com .env vazio/errado).
    env_file:
      - path: .env.ops
        required: false
    environment:
      OPS_AGENT_HOST: "0.0.0.0"
      OPS_AGENT_PORT: "9090"
      OPS_DEPLOY_DIR: /opt/lead-flow-bot
      OPS_COMPOSE_FILE: /opt/lead-flow-bot/docker-compose.vps.yml
    volumes:
      - /opt/lead-flow-bot:/opt/lead-flow-bot
      - /opt/lead-flow-app/backups:/opt/lead-flow-app/backups
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - studio-bot-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:9090/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  openwa:
    build:
      context: ./deploy/openwa-gateway
      dockerfile: Dockerfile
    image: openwa-gateway:latest
    restart: unless-stopped
    env_file: .env.openwa
    volumes:
      - openwa_sessions_tmp:/app/.wwebjs_tmp
    networks:
      - studio-bot-net
    expose:
      - "3333"
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  openwa_sessions_tmp:

networks:
  studio-bot-net:
    name: studio-bot-net
    driver: bridge
