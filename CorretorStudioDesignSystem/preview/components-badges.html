<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 22px 26px; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
.title { font-size: 11px; font-weight: 600; color: var(--muted-foreground); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11.5px; font-weight: 600; border: 1px solid; line-height: 1.4; }
.dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
.b-success { background: var(--semantic-success-surface); color: var(--semantic-success); border-color: var(--semantic-success-border); }
.b-success .dot { background: var(--semantic-success); }
.b-warning { background: var(--semantic-warning-surface); color: var(--semantic-warning); border-color: var(--semantic-warning-border); }
.b-warning .dot { background: var(--semantic-warning); }
.b-danger { background: var(--semantic-danger-surface); color: var(--semantic-danger); border-color: var(--semantic-danger-border); }
.b-danger .dot { background: var(--semantic-danger); }
.b-info { background: var(--semantic-info-surface); color: var(--semantic-info); border-color: var(--semantic-info-border); }
.b-info .dot { background: var(--semantic-info); }
.b-new { background: var(--semantic-new-surface); color: var(--semantic-new); border-color: var(--semantic-new-border); }
.b-new .dot { background: var(--semantic-new); }
.b-neutral { background: var(--muted); color: var(--muted-foreground); border-color: var(--border); }
.b-solid { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.subtitle { font-size: 10.5px; color: var(--muted-foreground); margin: 14px 0 6px; font-family: var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; }
</style></head>
<body>
<div class="title">Badges · tinted (preferred) + solid</div>
<div class="subtitle">Tinted — auto-adapts to dark</div>
<div class="row">
  <span class="badge b-success"><span class="dot"></span>Ativo</span>
  <span class="badge b-info"><span class="dot"></span>Aguardando</span>
  <span class="badge b-warning"><span class="dot"></span>Atenção</span>
  <span class="badge b-danger"><span class="dot"></span>Perdido</span>
  <span class="badge b-new"><span class="dot"></span>Em breve</span>
  <span class="badge b-neutral">SDR</span>
  <span class="badge b-neutral">CLOSER</span>
</div>
<div class="subtitle">Solid — critical status only</div>
<div class="row">
  <span class="badge b-solid">Em breve</span>
  <span class="badge b-success" style="background:var(--semantic-success);color:var(--semantic-success-foreground);border-color:transparent;">Ativo</span>
  <span class="badge b-danger" style="background:var(--semantic-danger);color:var(--semantic-danger-foreground);border-color:transparent;">Vencido</span>
</div>
</body></html>
