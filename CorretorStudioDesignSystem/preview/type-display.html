<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px 28px 18px; background: var(--background); color: var(--foreground); }
.eyebrow { font-size: 11px; font-weight: 600; color: var(--muted-foreground); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; font-family: var(--font-body); }
.hero { font-family: var(--font-display); font-size: 60px; font-weight: 800; line-height: 0.98; letter-spacing: -0.03em; }
.meta { display: flex; gap: 18px; margin-top: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--muted-foreground); }
.meta span:first-child { color: var(--foreground); font-weight: 600; }
.meta span.local { display: inline-flex; align-items: center; gap: 5px; color: var(--semantic-success); font-weight: 600; }
.meta span.local::before { content: ''; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
</style></head>
<body>
<div class="eyebrow">Display · Poppins 800 · local file</div>
<div class="hero">ALTA <span class="cs-gradient-text">PERFORMANCE</span></div>
<div class="meta">
  <span>Poppins 800</span>
  <span>60 / 0.98 / −0.03em</span>
  <span>display-lg</span>
  <span class="local">self-hosted</span>
</div>
</body></html>
