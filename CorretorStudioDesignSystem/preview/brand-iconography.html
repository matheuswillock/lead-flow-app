<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 22px 26px; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
.title { font-size: 11px; font-weight: 600; color: var(--muted-foreground); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.tile { width: 44px; height: 44px; border-radius: 12px; background: color-mix(in oklab, var(--primary) 14%, transparent); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; }
.tile.neutral { background: var(--muted); color: var(--foreground); }
.tile svg { width: 22px; height: 22px; stroke-width: 1.75; }
.tile.sm { width: 32px; height: 32px; border-radius: 8px; }
.tile.sm svg { width: 16px; height: 16px; }
.note { font-size: 11.5px; color: var(--muted-foreground); margin-top: 16px; line-height: 1.5; }
.note b { color: var(--foreground); font-weight: 600; }
</style></head>
<body>
<div class="title">Iconography · Lucide React · 1.5px stroke</div>
<div class="row">
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="10" rx="1"/></svg></div>
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
  <div class="tile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>

  <div class="tile sm neutral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
  <div class="tile sm neutral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
  <div class="tile sm neutral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>

</div>
<div class="note"><b>Rule:</b> Lucide only. No emoji. No filled icons. Container sizes <code>size-4</code> (16px) inline · <code>size-5</code> (20px) compact · <code>size-7</code> (28px) feature. Color: <code>currentColor</code> — tile decides the hue.</div>
</body></html>
