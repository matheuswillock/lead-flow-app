<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 24px; background: var(--background); font-family: var(--font-body); color: var(--foreground); }
.title { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px; }
.row { display: flex; gap: 12px; align-items: stretch; }
.card { flex: 1; border-radius: 14px; padding: 14px 16px; border: 1px solid var(--border); background: var(--card); display: flex; flex-direction: column; gap: 6px; min-height: 110px; }
.card.featured { border-color: var(--precision-border-strong); box-shadow: var(--precision-shadow-2); }
.label { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.value { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.value.indigo { color: var(--precision-indigo); }
.chip-row { display: flex; gap: 8px; margin-top: 8px; }
.chip { font-size: 10.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: color-mix(in oklab, var(--precision-indigo) 14%, var(--card)); color: var(--precision-indigo); border: 1px solid var(--precision-border-soft); }
.use { font-size: 11px; color: var(--muted-foreground); margin-top: auto; line-height: 1.45; }
</style></head>
<body>
<div class="title">Precision indigo — fintech polish only</div>
<div class="row">
  <div class="card">
    <span class="label">Default border</span>
    <span class="value">— var(--border)</span>
    <div class="chip-row"></div>
    <div class="use">99% of UI. Calm, neutral, OKLch chroma 0.004.</div>
  </div>
  <div class="card featured">
    <span class="label">Precision indigo</span>
    <span class="value indigo">#494fdf</span>
    <div class="chip-row">
      <span class="chip">Premium card</span>
      <span class="chip">Bradesco operator</span>
    </div>
    <div class="use">Two uses only: highlighted card border + the one operator chip.</div>
  </div>
</div>
</body></html>
