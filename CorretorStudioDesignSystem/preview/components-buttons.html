<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 22px 26px; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
.title { font-size: 11px; font-weight: 600; color: var(--muted-foreground); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font-family: var(--font-body); font-size: 14px; font-weight: 600; letter-spacing: -0.005em; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: 0; transition: all 150ms cubic-bezier(0.2,0,0,1); }
.btn-primary { background: var(--primary); color: var(--primary-foreground); border-radius: 16px; padding: 12px 22px; box-shadow: 0 12px 28px -8px color-mix(in oklab, var(--primary) 60%, transparent); }
.btn-secondary { background: color-mix(in oklab, var(--card) 70%, transparent); color: var(--foreground); border: 1px solid var(--border); border-radius: 16px; padding: 11px 22px; }
.btn-ghost { background: transparent; color: var(--muted-foreground); border-radius: 10px; padding: 9px 14px; }
.btn-ghost:hover { background: var(--accent); color: var(--foreground); }
.btn-pill { border-radius: 999px; padding: 7px 14px; font-size: 13px; background: color-mix(in oklab, var(--primary) 8%, var(--card)); color: var(--foreground); border: 1px solid color-mix(in oklab, var(--primary) 30%, var(--border)); }
.btn-pill .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--primary); }
.btn-icon { width: 36px; height: 36px; border-radius: 8px; padding: 0; justify-content: center; background: var(--card); border: 1px solid var(--border); color: var(--foreground); }
svg { width: 16px; height: 16px; flex-shrink: 0; }
</style></head>
<body>
<div class="title">Buttons · primary · secondary · ghost · pill · icon</div>
<div class="row">
  <button class="btn btn-primary">Agendar demonstração <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  <button class="btn btn-secondary">Ver como funciona</button>
  <button class="btn btn-ghost">Entrar</button>
  <button class="btn btn-pill"><span class="dot"></span>Em breve · Campanhas</button>
  <button class="btn btn-icon" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
</body></html>
