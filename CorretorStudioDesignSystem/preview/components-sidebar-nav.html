<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 0; background: oklch(0.985 0 0); color: var(--foreground); font-family: var(--font-body); }
.sidebar { width: 260px; padding: 18px 12px; border-right: 1px solid var(--border); min-height: 360px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand img { width: 28px; height: 28px; border-radius: 6px; }
.brand-name { font-family: var(--font-display); font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; }
.workspace { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; color: var(--muted-foreground); display: flex; align-items: center; justify-content: space-between; margin: 0 4px 14px; }
.group-label { font-size: 10.5px; font-weight: 600; color: var(--muted-foreground); padding: 8px 10px 6px; letter-spacing: 0.04em; text-transform: uppercase; }
.item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--foreground); cursor: pointer; margin: 1px 4px; }
.item:hover { background: var(--accent); }
.item.active { background: oklch(0.967 0.001 286); color: var(--foreground); }
.item.active .leading { background: var(--primary); }
.leading { width: 3px; height: 16px; border-radius: 999px; background: transparent; flex-shrink: 0; }
.item svg { width: 16px; height: 16px; color: var(--muted-foreground); flex-shrink: 0; }
.item.active svg { color: var(--primary); }
.pill { margin-left: auto; font-size: 10px; background: color-mix(in oklab, var(--primary) 12%, transparent); color: var(--primary); padding: 2px 6px; border-radius: 4px; font-weight: 600; }
</style></head>
<body>
<aside class="sidebar">
  <div class="brand">
    <img src="../assets/corretor-studio-icon.svg" alt="">
    <span class="brand-name">Corretor Studio</span>
  </div>
  <div class="workspace"><span>Acme Corretora</span><span>▾</span></div>
  <div class="group-label">Navegação</div>
  <div class="item"><span class="leading"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>Dashboard</div>
  <div class="item active"><span class="leading"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>CRM</div>
  <div class="item"><span class="leading"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Calendário</div>
  <div class="item"><span class="leading"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Performance<span class="pill">Beta</span></div>
</aside>
</body></html>
