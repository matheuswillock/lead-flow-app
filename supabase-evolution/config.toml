# Supabase — corretor-studio-evolution
# Projeto dedicado ao banco Postgres da Evolution API (WhatsApp).
# Separado do Supabase principal do Lead Flow (supabase/).

project_id = "corretor-studio-evolution"

[api]
enabled = false

[db]
# Apenas referência para CLI; Evolution usa pooler remoto (ver .env.evolution).
port = 55332
shadow_port = 55330
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
